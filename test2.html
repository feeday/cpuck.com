<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPuck AI Test2</title>
<style>
body{margin:0;background:#020617;color:#f8fafc;font-family:Inter,Arial,sans-serif}
#searchBox{position:relative;width:380px;margin:30px auto}
input{width:100%;height:44px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:white;padding:0 18px;box-sizing:border-box}
#article-result{display:none;position:absolute;top:55px;width:100%;background:#111827;border:1px solid #334155;border-radius:16px;z-index:99;overflow:hidden}
.article-item{padding:12px 16px;border-bottom:1px solid #334155;cursor:pointer}
.article-item:hover{background:#1e293b}
.article-item span{color:#94a3b8;font-size:14px}
.note{text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div id="searchBox">
<input id="search" placeholder="搜索文章">
<div id="article-result"></div>
</div>
<div class="note">test2.html 文章搜索测试</div>
<script>
let posts=[];
async function loadPosts(){
 try{posts=await fetch('data/posts.json').then(r=>r.json())}catch(e){posts=[]}
}
function searchPosts(q){
 let box=document.getElementById('article-result');
 if(!q){box.style.display='none';return;}
 let arr=posts.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase())).slice(0,10);
 if(!arr.length){box.style.display='none';return;}
 box.innerHTML=arr.map(x=>`<div class="article-item" onclick="location.href='${x.url||x.link||'#'}'"><b>${x.title||x.name||''}</b><br><span>${x.desc||''}</span></div>`).join('');
 box.style.display='block';
}
document.getElementById('search').oninput=e=>searchPosts(e.target.value);
loadPosts();
</script>
</body>
</html>
