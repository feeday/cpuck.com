name: Publish Issues
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, deleted]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-issues
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Pages uses the custom workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow. Branch publishing overwrites the generated article URLs."
            exit 1
          fi
      - name: Build articles in data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_issues.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if ! git diff --cached --quiet; then
            git commit -m "Publish Issue articles in data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage public website
        run: python3 scripts/stage_site.py /tmp/cpuck-public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/cpuck-public
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated articles
        id: deployment
        uses: actions/deploy-pages@v4
