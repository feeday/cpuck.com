name: Publish Issues
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish_issues.py
      - .github/workflows/publish-issues.yml
permissions:
  contents: read
concurrency:
  group: publish-issues
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build articles and versioned backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_issues.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/search.json
          if [ -d blog/posts ]; then git add blog/posts; fi
          if [ -d blog/backups ]; then git add blog/backups; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish Issue articles and backups"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage public website
        run: |
          mkdir -p /tmp/cpuck-public
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='tests' --exclude='blog/backups' ./ /tmp/cpuck-public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/cpuck-public
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated articles
        id: deployment
        uses: actions/deploy-pages@v4
