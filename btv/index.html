<script>
/* 本仓库 GitHub Issues。GitHub Pages 项目路径自动识别；自定义域名使用对应仓库兜底。 */
const GITHUB_REPO = (() => {
  const host = window.location.hostname.toLowerCase();
  const match = host.match(/^([a-z\d-]+)\.github\.io$/);
  if (match) {
    const project = window.location.pathname.split('/').filter(Boolean)[0];
    return match[1] + '/' + (project || match[1] + '.github.io');
  }
  return 'feeday/cpuck.com';
})();
const ISSUE_PREFIX_COMMENT = '[留言]';
const ISSUE_PREFIX_VIDEO = '[投稿]';
const ISSUE_CACHE_KEY = 'cpuck:btv:github-issues:v1';
const ISSUE_CACHE_TTL = 5 * 60 * 1000;
let database = [], currentIndex = 0, latestCommentId = null, cachedIssues = [];
let lastGithubFetch = 0, lastGithubAttempt = 0, githubIssuesError = '', issueCacheHydrated = false;
function hydrateIssueCache() {
  if (issueCacheHydrated) return;
  issueCacheHydrated = true;
  try {
    const saved = JSON.parse(localStorage.getItem(ISSUE_CACHE_KEY) || 'null');
    if (saved && Array.isArray(saved.items)) {
      cachedIssues = saved.items.filter(item => !item.pull_request);
      lastGithubFetch = Number(saved.fetchedAt) || 0;
      lastGithubAttempt = lastGithubFetch;
    }
  } catch (e) { console.warn('读取 GitHub 留言缓存失败：', e); }
}
function saveIssueCache() {
  try {
    localStorage.setItem(ISSUE_CACHE_KEY, JSON.stringify({fetchedAt:lastGithubFetch,items:cachedIssues}));
  } catch (e) { console.warn('保存 GitHub 留言缓存失败：', e); }
}
const $ = id => document.getElementById(id);
const repoIsConfigured = () => /^[a-z\d_.-]+\/[a-z\d_.-]+$/i.test(GITHUB_REPO);
function githubSetupNotice() {
  return '无法识别当前 GitHub 仓库：' + GITHUB_REPO + '。请检查 Pages 发布路径及仓库 Issues 设置。';
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function bilibiliBV(value) {
  const input = String(value || '').trim();
  let found = input.match(/^(BV[a-zA-Z0-9]{10})\/?$/i);
  if (found) return 'BV' + found[1].slice(2);
  try {
    const url = new URL(input);
    if (!['https:','http:'].includes(url.protocol) || !(url.hostname==='bilibili.com'||url.hostname.endsWith('.bilibili.com'))) return null;
    found = url.pathname.match(/(?:^|\/)video\/(BV[a-zA-Z0-9]{10})(?:\/|$)/i);
    return found ? 'BV' + found[1].slice(2) : null;
  } catch { return null; }
}
function submitGithubIssue(title, body) {
  if (!repoIsConfigured()) { alert(githubSetupNotice()); return false; }
  const url = `https://github.com/${GITHUB_REPO}/issues/new?` + new URLSearchParams({title,body});
  // GitHub 授权与提交在 github.com 完成，不在静态页面保存写入密钥。
  // noopener 模式下 window.open 可能返回 null，即使标签页实际打开，也不应误报被拦截。
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.target = '_blank';
  anchor.rel = 'noopener noreferrer';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  return true;
}
async function fetchIssues(force=false) {
  if (!repoIsConfigured()) return [];
  hydrateIssueCache();
  const now = Date.now();
  // 页面轮询和刷新优先复用缓存，避免匿名 GitHub API 请求过密。
  if (!force && ((lastGithubFetch && now-lastGithubFetch < ISSUE_CACHE_TTL) ||
      (lastGithubAttempt && now-lastGithubAttempt < ISSUE_CACHE_TTL))) return cachedIssues;
  const endpoint = `https://api.github.com/repos/${GITHUB_REPO}/issues?state=open&per_page=100&sort=created&direction=desc`;
  lastGithubAttempt = now;
  try {
    const res = await fetch(endpoint,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if (!res.ok) throw Error(res.status===404?'仓库不存在、未公开或未开启 Issues':`GitHub API HTTP ${res.status}`);
    cachedIssues = (await res.json()).filter(item=>!item.pull_request);
    lastGithubFetch = Date.now();
    lastGithubAttempt = lastGithubFetch;
    githubIssuesError = '';
    saveIssueCache();
    return cachedIssues;
  } catch (e) {
    githubIssuesError = e?.message || '网络请求失败';
    console.warn('GitHub Issues API 读取失败：', e);
    // API 暂时限流或离线时返回上次缓存；视频播放列表不依赖此接口。
    return cachedIssues;
  }
}
async function loadDatabase(force=false) {
  const originals = [];
  try {
    const r = await fetch('./videos.txt?t='+Date.now(),{cache:'no-store'});
    if (r.ok) {
      const lines=(await r.text()).split(/\r?\n/);
      for(const line of lines) { const bv=bilibiliBV(line.trim()); if(bv)originals.push(bv); }
    }
  } catch(e){console.warn('读取 btv/videos.txt 失败：',e);}
  try {
    const issues=await fetchIssues(force);
    for(const issue of [...issues].reverse()) {
      if(String(issue.title||'').startsWith(ISSUE_PREFIX_VIDEO)) {
        const bv=bilibiliBV(String(issue.title).slice(ISSUE_PREFIX_VIDEO.length).trim()) || bilibiliBV(issue.body||'');
        if(bv)originals.push(bv);
      }
    }
  } catch(e){console.warn('GitHub 投稿读取失败：',e);}
  const unique=[...new Set(originals)];
  database=unique.map((bv,index)=>({id:String(index+1).padStart(2,'0'),src:bv,desc:'TARGET_ID: '+bv}));
  if (!database.length) {
    $('video-container').textContent='暂无视频。可创建 btv/videos.txt 或通过 SMART DETECT 提交 GitHub Issue。';
    $('page-indicator').textContent='00 / 00';
  }
}
function changePage(direction) {
  if(!database.length)return;
  currentIndex=(currentIndex+direction+database.length)%database.length;
  loadCase(currentIndex);
}
function loadCase(index, auto=true) {
  if(!database.length)return;
  currentIndex=Math.min(Math.max(index,0),database.length-1);
  const bv=database[currentIndex].src;
  $('page-indicator').textContent=`${String(currentIndex+1).padStart(2,'0')} / ${String(database.length).padStart(2,'0')}`;
  $('bili-source-btn').href=`https://www.bilibili.com/video/${encodeURIComponent(bv)}/`;
  if (auto) loadVideo();
  else {
    const container=$('video-container');
    container.replaceChildren();
    const prompt=document.createElement('div');
    prompt.className='w-full h-full flex flex-col items-center justify-center cursor-pointer text-gray-600 hover:text-green-400 font-mono text-xs';
    prompt.textContent='▶ CLICK TO ESTABLISH UPLINK';
    prompt.onclick=loadVideo; container.append(prompt);
  }
}
function loadVideo() {
  if(!database.length)return;
  const frame=document.createElement('iframe'); frame.className='bili-full';
  frame.src=`https://player.bilibili.com/player.html?bvid=${encodeURIComponent(database[currentIndex].src)}&page=1&high_quality=1&danmaku=0&autoplay=1`;
  frame.allowFullscreen=true;
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  $('video-container').replaceChildren(frame);
}
function timeAgo(s) {
  const seconds=Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/1000));
  if(!Number.isFinite(seconds))return '';
  if(seconds<60)return 'NOW'; if(seconds<3600)return Math.floor(seconds/60)+'M';
  if(seconds<86400)return Math.floor(seconds/3600)+'H'; return Math.floor(seconds/86400)+'D';
}
async function loadComments(isAutoRefresh=false,force=false) {
  const list=$('comment-list');
  if(!repoIsConfigured()) { list.textContent=githubSetupNotice();return; }
  try {
    const issues=await fetchIssues(force);
    const items=issues.filter(i=>String(i.title||'').startsWith(ISSUE_PREFIX_COMMENT)).slice(0,20);
    if(isAutoRefresh && !force && latestCommentId===items[0]?.id)return;
    latestCommentId=items[0]?.id||null;
    list.replaceChildren();
    if(!items.length){
      list.textContent = githubIssuesError
        ? 'GitHub 留言接口暂时不可用（'+githubIssuesError+'）。视频播放不受影响，请稍后重试。'
        : 'NO LOGS FOUND · 暂无公开留言';
      return;
    }
    for(const item of items){
      const div=document.createElement('div');div.className='group mb-4';
      const head=document.createElement('div');head.className='flex justify-between items-baseline mb-1';
      const author=document.createElement('a'); author.className='text-[14px] font-bold text-gray-300 group-hover:text-[#00f0ff] transition-colors';
      author.href=item.html_url;author.target='_blank';author.rel='noopener noreferrer';
      author.textContent=item.user?.login || 'GitHub 用户';
      const when=document.createElement('span');when.className='text-[10px] text-gray-600 font-mono';when.textContent=timeAgo(item.created_at);
      head.append(author,when);
      const content=document.createElement('div');content.className='text-[13px] text-gray-400 break-words leading-relaxed whitespace-pre-wrap';
      content.textContent=String(item.body||item.title.slice(ISSUE_PREFIX_COMMENT.length)).slice(0,2000);
      div.append(head,content);list.append(div);
    }
  } catch(e) {
    if(!isAutoRefresh) list.textContent='留言暂时无法加载，视频播放不受影响。'+(e?.message?' 原因：'+e.message:'');
    console.warn(e);
  }
}
async function postComment() {
  const input=$('message'), content=input.value.trim();
  if(!content){input.focus();return;}
  if(content.length>2000){alert('留言最多 2000 字');return;}
  // 请访问 GitHub 提交 Issue，不能在静态网页上伪造提交成功。
  const title=ISSUE_PREFIX_COMMENT+' '+content.replace(/\s+/g,' ').slice(0,70);
  if(submitGithubIssue(title,content)) alert('已尝试打开 GitHub 投稿页。请登录并点击 Submit new issue，提交完成后留言才会公开显示。');
}
function extractBilibiliBvidClient(v){return bilibiliBV(v);}
function submitPlaylist() {
  const input=$('message'),bv=bilibiliBV(input.value);
  if(!bv){alert('仅支持 Bilibili 视频完整链接或 BV 号');input.focus();return;}
  if(database.some(v=>v.src===bv)){alert('该视频已在播放列表中');return;}
  if(submitGithubIssue(ISSUE_PREFIX_VIDEO+' '+bv,'Bilibili 视频投稿：\nhttps://www.bilibili.com/video/'+bv+'/'))
    alert('已尝试打开 GitHub 投稿页。请登录并提交 Issue；发布后刷新网站即可看到投稿。');
}
async function manualRefresh() {
  const icon=$('refresh-icon'); icon.classList.add('fa-spin');
  const old=database[currentIndex]?.src;
  try {
    await loadDatabase(true);
    if(database.length){const i=database.findIndex(x=>x.src===old);loadCase(i<0?0:i,false);}
    await loadComments(false,false);
    $('comment-list').scrollTop=0;
  } catch(e) {
    console.warn('手动刷新失败：',e);
    if(!database.length) $('video-container').textContent='播放列表暂时无法加载，请稍后重试。';
  } finally {icon.classList.remove('fa-spin');}
}
function toggleExtensionFrame(){ $('extension-drawer').classList.toggle('translate-x-full'); }
window.addEventListener('load',async()=>{
  $('performance-result').textContent='加载:'+Math.round(performance.now())+'ms';
  await loadDatabase();if(database.length)loadCase(0,false);
  await loadComments();
  // 低频轮询并使用 5 分钟缓存；GitHub API 故障时继续显示缓存留言和本地视频列表。
  setInterval(()=>{if(document.visibilityState==='visible')loadComments(true)},120000);
  document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
    if(e.key==='ArrowRight')changePage(1);if(e.key==='ArrowLeft')changePage(-1);});
});
</script>
