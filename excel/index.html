.categories{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:21px}.cat{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:100px;padding:8px 14px;font-size:13px;transition:.15s}.cat.on{background:var(--primary);border-color:var(--primary);color:white}.cat:hover{border-color:var(--primary)}

.items{max-height:calc(100vh - 265px);min-height:420px;overflow:auto;overscroll-behavior:contain}.item{width:100%;display:flex;align-items:start;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:transparent;padding:14px 15px;color:var(--text)}.item:last-child{border-bottom:0}.item:hover{background:var(--bg)}.item.on{background:var(--primary-bg);border-left-color:var(--primary)}.itemmain{min-width:0;flex:1}.itemtitle{font-weight:750;letter-spacing:.01em}.itemcat{font-size:11px;color:var(--muted);margin-left:7px;font-weight:400}.itemdesc{color:var(--muted);font-size:12px;margin:3px 0 5px}.itemresult{font-size:12px;color:var(--good);overflow-wrap:anywhere}.star{border:0;background:transparent;font-size:22px;line-height:1;color:#a0adbf;padding:0 0 5px 5px}.star.on{color:#e9a52b}
.detail{position:sticky;top:82px}.dtop{padding:25px 27px 17px;border-bottom:1px solid var(--line)}.subpill{font-size:11px;color:var(--primary);background:var(--primary-bg);border-radius:100px;padding:5px 11px;display:inline-block;font-weight:700}.dtitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.dtitle h2{font-size:clamp(25px,2.4vw,32px);margin:11px 0 7px;letter-spacing:-.035em}.dtop p{font-size:14px;margin:0;color:var(--muted)}.section{padding:21px 27px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section h3{font-size:13px;letter-spacing:.02em;margin:0 0 11px;display:flex;align-items:center;gap:8px}.numb{width:23px;height:23px;border-radius:8px;display:inline-grid;place-items:center;background:var(--secondary);color:var(--muted);font-size:11px;font-weight:800}.codebar{display:flex;align-items:center;gap:10px;background:#17243a;color:#dbe8ff;border:1px solid #263852;border-radius:13px;padding:12px 13px}.formula{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;overflow-wrap:anywhere;word-break:break-word;flex:1;white-space:pre-wrap}.copy{flex:none;border:1px solid #536783;background:#2b3f5d;color:white;border-radius:9px;font-size:12px;padding:7px 10px}.copy:hover{background:#385577}.sheetwrap{border:1px solid var(--line);border-radius:12px;overflow:auto}.sheet{border-collapse:collapse;width:100%;font-size:12px;min-width:540px}.sheet th,.sheet td{border:1px solid var(--line);padding:8px 9px;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}.sheet thead th{background:var(--secondary);color:var(--muted);font-weight:700}.sheet .rownum{width:34px;color:var(--muted);background:var(--secondary);text-align:center;font-weight:550}.sheet tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--surface) 95%,var(--secondary))}.sheet td.refcell{background:var(--primary-bg)!important;outline:1px solid #bbcff8;outline-offset:-1px}
.sheetcaption{font-size:12px;color:var(--muted);margin:0 0 9px}.resultbox{border:1px solid #bfe3d5;background:#f0fbf6;border-radius:12px;padding:15px 17px;display:flex;align-items:center;gap:13px}.resultbox .arrow{font-weight:800;color:#0a9467;font-size:18px}.resultbox .value{font-size:19px;font-weight:750;color:#04724e;overflow-wrap:anywhere}.notice{font-size:13px;line-height:1.7;color:var(--muted);background:var(--secondary);border-radius:12px;padding:12px 15px}.detailnav{display:flex;justify-content:space-between;gap:12px;padding:16px 27px}.detailnav button{border:1px solid var(--line);color:var(--text);background:var(--surface);border-radius:10px;padding:9px 14px}.foot{color:var(--muted);font-size:12px;margin:24px 0 0;text-align:center}.empty{padding:30px;text-align:center;color:var(--muted)}
.dark{--bg:#101723;--surface:#182335;--secondary:#233148;--text:#e8eef9;--muted:#9dabbe;--line:#2b3950;--primary:#8aafff;--primary-bg:#243954;--good:#54d5a4;--shadow:none;color-scheme:dark}.dark .top{background:rgba(24,35,53,.95)}.dark .stats{border-color:#355276}.dark .stats span{color:#a7b7ca}.dark .resultbox{background:#143a32;border-color:#21644f}.dark .resultbox .value{color:#b0fbe0}.dark .resultbox .arrow{color:#b0fbe0}.dark .codebar{background:#0e1829}
@media(max-width:950px){.layout{grid-template-columns:minmax(0,1fr)}.items{min-height:0;max-height:270px}.detail{position:static}.intro{align-items:start}.stats{padding:10px;gap:13px}.stats b{font-size:18px}}
@media(max-width:620px){.topin{padding:9px 14px}.wrap{padding:20px 12px 40px}.intro{display:block}.stats{display:inline-flex;margin-top:16px}.intro h1{font-size:28px}.dtop,.section{padding:17px 16px}.detailnav{padding:14px 16px}.categories{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.cat{white-space:nowrap}.back{font-size:12px}.item{padding:11px 13px}.items{max-height:245px}.sheet{font-size:11px}.stats b{font-size:18px}}

<script>
"use strict";
const library=[{"name":"XLOOKUP","category":"查找匹配","desc":"根据代号精确查回实体名称","formula":"=XLOOKUP(\"DemoC\",B2:B6,A2:A6,\"未找到\")","result":"样例丙","tip":"在 B 列寻找 DemoC，返回同一行 A 列；适合中英名称映射。","source":"people","alias":""},{"name":"VLOOKUP","category":"查找匹配","desc":"根据代号返回图片数","formula":"=VLOOKUP(\"DemoB\",B2:C6,2,FALSE)","result":"6","tip":"查询值必须在所选区域首列；2 表示返回区域第 2 列。","source":"people","alias":""},{"name":"HLOOKUP","category":"查找匹配","desc":"从横向标题查字段","formula":"=HLOOKUP(\"图片数\",A1:F2,2,FALSE)","result":"8","tip":"在第 1 行查“图片数”，返回第 2 行对应的值。","source":"people","alias":""},{"name":"INDEX","category":"查找匹配","desc":"按第几行、第几列取值","formula":"=INDEX(A2:F6,3,1)","result":"样例丙","tip":"数据区域内第 3 行、第 1 列。","source":"people","alias":""},{"name":"MATCH","category":"查找匹配","desc":"返回匹配值在范围中的位置","formula":"=MATCH(\"DemoD\",B2:B6,0)","result":"4","tip":"0 表示精确匹配；DemoD 是查找范围中第 4 项。","source":"people","alias":""},{"name":"XMATCH","category":"查找匹配","desc":"新版位置匹配","formula":"=XMATCH(\"DemoD\",B2:B6)","result":"4","tip":"需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"INDEX+MATCH","category":"查找匹配","desc":"旧版兼容的双向定位","formula":"=INDEX(A2:A6,MATCH(\"DemoC\",B2:B6,0))","result":"样例丙","tip":"先定位代号所在行，再从 A 列取姓名。","source":"people","alias":""},{"name":"IFERROR+VLOOKUP","category":"查找匹配","desc":"未找到时显示友好提示","formula":"=IFERROR(VLOOKUP(\"DemoX\",B2:C6,2,0),\"未找到\")","result":"未找到","tip":"避免出现 #N/A。","source":"people","alias":""},{"name":"COUNTIF+IF","category":"查找匹配","desc":"判断指定 ID 是否存在","formula":"=IF(COUNTIF(A2:A6,\"00003\")>0,\"存在\",\"不存在\")","result":"存在","tip":"ID 统一设置为文本，避免前导零丢失。","source":"lists","alias":""},{"name":"CHOOSE","category":"查找匹配","desc":"根据序号选取一项","formula":"=CHOOSE(2,\"Flux\",\"SDXL\",\"SD1.5\")","result":"SDXL","tip":"2 表示选第二项。","source":"people","alias":""},{"name":"ROW","category":"查找匹配","desc":"获取单元格行号","formula":"=ROW(C5)","result":"5","tip":"常用于动态序号。","source":"people","alias":""},{"name":"COLUMN","category":"查找匹配","desc":"获取单元格列号","formula":"=COLUMN(D2)","result":"4","tip":"D 是第 4 列。","source":"people","alias":""},{"name":"INDIRECT","category":"查找匹配","desc":"文本转单元格引用","formula":"=INDIRECT(\"C2\")","result":"8","tip":"将文本 C2 解释为单元格地址。","source":"people","alias":""},{"name":"ADDRESS","category":"查找匹配","desc":"将行列数字组合为地址","formula":"=ADDRESS(3,2)","result":"$B$3","tip":"将第 3 行、第 2 列转成绝对引用。","source":"people","alias":""},{"name":"IF","category":"逻辑判断","desc":"根据条件返回不同结果","formula":"=IF(C2>=8,\"达标\",\"未达标\")","result":"达标","tip":"C2=8，所以结果为达标。","source":"people","alias":""},{"name":"IFS","category":"逻辑判断","desc":"判断多个等级","formula":"=IFS(F2>=90,\"优秀\",F2>=80,\"良好\",TRUE,\"待提升\")","result":"优秀","tip":"按顺序执行，遇到首个 TRUE 就返回。","source":"people","alias":""},{"name":"IFERROR","category":"逻辑判断","desc":"错误时显示备用内容","formula":"=IFERROR(1/0,\"无法计算\")","result":"无法计算","tip":"除以零时不显示 #DIV/0!。","source":"people","alias":""},{"name":"IFNA","category":"逻辑判断","desc":"只处理 #N/A","formula":"=IFNA(MATCH(\"DemoX\",B2:B6,0),\"无匹配\")","result":"无匹配","tip":"其他类型错误不会被隐藏。","source":"people","alias":""},{"name":"AND","category":"逻辑判断","desc":"所有条件均满足","formula":"=AND(C2>=8,E2=\"通过\")","result":"TRUE","tip":"图片数达 8 且状态为通过。","source":"people","alias":""},{"name":"OR","category":"逻辑判断","desc":"至少一个条件满足","formula":"=OR(D2=\"Flux\",C2>10)","result":"TRUE","tip":"D2 是 Flux，所以成立。","source":"people","alias":""},{"name":"NOT","category":"逻辑判断","desc":"反转逻辑值","formula":"=NOT(E2=\"待查\")","result":"TRUE","tip":"E2=通过，不等于待查。","source":"people","alias":""},{"name":"SWITCH","category":"逻辑判断","desc":"不同模型映射简称","formula":"=SWITCH(D2,\"Flux\",\"DiT\",\"SDXL\",\"UNet\",\"其他\")","result":"DiT","tip":"根据 D2 的模型文字选择返回值。","source":"people","alias":""},{"name":"IF+AND","category":"逻辑判断","desc":"同时达标才通过","formula":"=IF(AND(C2>=8,F2>=90),\"合格\",\"复核\")","result":"合格","tip":"C2=8 且 F2=92。","source":"people","alias":""},{"name":"IF+OR","category":"逻辑判断","desc":"任一条件满足则标记","formula":"=IF(OR(E2=\"待查\",F2<70),\"需处理\",\"正常\")","result":"正常","tip":"E2 为通过且 F2=92。","source":"people","alias":""},{"name":"ISNUMBER","category":"逻辑判断","desc":"判断是否为数字","formula":"=ISNUMBER(C2)","result":"TRUE","tip":"图片数是数值 8。","source":"people","alias":""},{"name":"ISTEXT","category":"逻辑判断","desc":"判断是否为文本","formula":"=ISTEXT(B2)","result":"TRUE","tip":"DemoA 为文本。","source":"people","alias":""},{"name":"ISBLANK","category":"逻辑判断","desc":"判断是否空白","formula":"=ISBLANK(A20)","result":"TRUE","tip":"示例假设 A20 为空单元格。","source":"people","alias":""},{"name":"SUM","category":"统计汇总","desc":"计算一列金额总和","formula":"=SUM(B2:B6)","result":"800","tip":"120+200+80+160+240。","source":"numbers","alias":""},{"name":"SUMIF","category":"统计汇总","desc":"单条件求和","formula":"=SUMIF(D2:D6,\"甲组\",B2:B6)","result":"440","tip":"只加总甲组的金额。","source":"numbers","alias":""},{"name":"SUMIFS","category":"统计汇总","desc":"多条件求和","formula":"=SUMIFS(B2:B6,D2:D6,\"甲组\",B2:B6,\">100\")","result":"360","tip":"甲组中金额大于 100 的是 120 和 240。","source":"numbers","alias":""},{"name":"SUMPRODUCT","category":"统计汇总","desc":"对应列相乘再求和","formula":"=SUMPRODUCT(B2:B6,C2:C6)","result":"2040","tip":"每行金额×数量后相加。","source":"numbers","alias":""},{"name":"COUNT","category":"统计汇总","desc":"统计数值单元格个数","formula":"=COUNT(B2:B6)","result":"5","tip":"金额列有 5 个数字。","source":"numbers","alias":""},{"name":"COUNTA","category":"统计汇总","desc":"统计非空单元格数","formula":"=COUNTA(A2:A6)","result":"5","tip":"文本、数值均计入。","source":"numbers","alias":""},{"name":"COUNTBLANK","category":"统计汇总","desc":"统计空白单元格数","formula":"=COUNTBLANK(F2:F6)","result":"5","tip":"模拟表格 F2:F6 均为空。","source":"numbers","alias":""},{"name":"COUNTIF","category":"统计汇总","desc":"统计符合条件的记录数","formula":"=COUNTIF(D2:D6,\"Flux\")","result":"3","tip":"共有 3 行 Flux。","source":"people","alias":""},{"name":"COUNTIFS","category":"统计汇总","desc":"按两个条件同时计数","formula":"=COUNTIFS(D2:D6,\"Flux\",E2:E6,\"通过\")","result":"2","tip":"样例甲与样例丙满足两个条件。","source":"people","alias":""},{"name":"AVERAGE","category":"统计汇总","desc":"求平均值","formula":"=AVERAGE(B2:B6)","result":"160","tip":"金额均值 800÷5。","source":"numbers","alias":""},{"name":"AVERAGEIF","category":"统计汇总","desc":"单条件平均值","formula":"=AVERAGEIF(D2:D6,\"甲组\",B2:B6)","result":"146.67","tip":"甲组金额平均为 440÷3，显示两位小数。","source":"numbers","alias":""},{"name":"MAX","category":"统计汇总","desc":"找最大值","formula":"=MAX(B2:B6)","result":"240","tip":"金额最大值。","source":"numbers","alias":""},{"name":"MIN","category":"统计汇总","desc":"找最小值","formula":"=MIN(B2:B6)","result":"80","tip":"金额最小值。","source":"numbers","alias":""},{"name":"MAXIFS","category":"统计汇总","desc":"多条件取最大","formula":"=MAXIFS(B2:B6,D2:D6,\"甲组\")","result":"240","tip":"甲组的最大金额。","source":"numbers","alias":""},{"name":"MINIFS","category":"统计汇总","desc":"多条件取最小","formula":"=MINIFS(B2:B6,D2:D6,\"乙组\")","result":"160","tip":"乙组金额为 200 和 160。","source":"numbers","alias":""},{"name":"MEDIAN","category":"统计汇总","desc":"求中位数","formula":"=MEDIAN(B2:B6)","result":"160","tip":"排序后中间位置的值。","source":"numbers","alias":""},{"name":"LARGE","category":"统计汇总","desc":"取第 N 大","formula":"=LARGE(B2:B6,2)","result":"200","tip":"第二大金额。","source":"numbers","alias":""},{"name":"SMALL","category":"统计汇总","desc":"取第 N 小","formula":"=SMALL(B2:B6,2)","result":"120","tip":"第二小金额。","source":"numbers","alias":""},{"name":"RANK.EQ","category":"统计汇总","desc":"排名","formula":"=RANK.EQ(200,B2:B6,0)","result":"2","tip":"0 表示降序排名。","source":"numbers","alias":""},{"name":"ROUND","category":"统计汇总","desc":"四舍五入","formula":"=ROUND(440/3,2)","result":"146.67","tip":"保留小数点后两位。","source":"numbers","alias":""},{"name":"ROUNDUP","category":"统计汇总","desc":"向远离零的方向进位","formula":"=ROUNDUP(6.21,1)","result":"6.3","tip":"保留一位小数。","source":"numbers","alias":""},{"name":"ROUNDDOWN","category":"统计汇总","desc":"向零的方向舍去","formula":"=ROUNDDOWN(6.29,1)","result":"6.2","tip":"保留一位小数。","source":"numbers","alias":""},{"name":"INT","category":"统计汇总","desc":"向下取整","formula":"=INT(6.9)","result":"6","tip":"注意负数的向下取整方向。","source":"numbers","alias":""},{"name":"MOD","category":"统计汇总","desc":"返回余数","formula":"=MOD(17,5)","result":"2","tip":"17 除以 5，余数为 2。","source":"numbers","alias":""},{"name":"ABS","category":"统计汇总","desc":"取绝对值","formula":"=ABS(-15)","result":"15","tip":"消除正负符号。","source":"numbers","alias":""},{"name":"SUBTOTAL","category":"统计汇总","desc":"筛选时只统计可见行","formula":"=SUBTOTAL(109,B2:B6)","result":"800","tip":"未筛选时合计 800；筛选后排除被隐藏的行。109 还忽略手动隐藏的行。","source":"numbers","alias":""},{"name":"LEFT","category":"文本处理","desc":"从文件名前面截取 ID","formula":"=LEFT(A2,5)","result":"00001","tip":"保留五位编号的前导零。","source":"files","alias":""},{"name":"RIGHT","category":"文本处理","desc":"从右侧截取字符","formula":"=RIGHT(A2,3)","result":"png","tip":"示例文件名以 png 结尾。","source":"files","alias":""},{"name":"MID","category":"文本处理","desc":"从中间截取内容","formula":"=MID(A2,16,6)","result":"Person","tip":"第 16 个字符起取 6 个字符。","source":"files","alias":""},{"name":"LEN","category":"文本处理","desc":"统计文本长度","formula":"=LEN(\"DemoA\")","result":"5","tip":"数字、字母、符号都算字符。","source":"files","alias":""},{"name":"FIND","category":"文本处理","desc":"区分大小写查找字符位置","formula":"=FIND(\"_\",A2)","result":"6","tip":"第一个下划线在第 6 个字符。","source":"files","alias":""},{"name":"SEARCH","category":"文本处理","desc":"不区分大小写查找位置","formula":"=SEARCH(\"demoa\",A2)","result":"23","tip":"在文件名里检索 DemoA 的起始位置。","source":"files","alias":""},{"name":"TEXTBEFORE","category":"文本处理","desc":"提取分隔符前的文本","formula":"=TEXTBEFORE(A2,\"_\")","result":"00001","tip":"需要较新的 Excel / WPS 版本。","source":"files","alias":""},{"name":"TEXTAFTER","category":"文本处理","desc":"从路径提取文件名","formula":"=TEXTAFTER(B2,\"\\\",-1)","result":"00001_Original_Person_DemoA.png","tip":"-1 表示从最后一个反斜杠开始定位。 需要较新的 Excel / WPS 版本。","source":"files","alias":""},{"name":"TEXTSPLIT","category":"文本处理","desc":"按下划线拆分文件名","formula":"=TEXTSPLIT(A2,\"_\")","result":"00001｜Original｜Person｜DemoA.png","tip":"需要较新的 Excel / WPS 版本。","source":"files","alias":""},{"name":"SUBSTITUTE","category":"文本处理","desc":"替换所有指定文本","formula":"=SUBSTITUTE(A2,\"Original\",\"Edit\")","result":"00001_Edit_Person_DemoA.png","tip":"适合批量改文件名中的固定字段。","source":"files","alias":""},{"name":"REPLACE","category":"文本处理","desc":"按位置替换字符","formula":"=REPLACE(\"AB-00001\",1,2,\"CD\")","result":"CD-00001","tip":"从第 1 位开始替换 2 个字符。","source":"files","alias":""},{"name":"TRIM","category":"文本处理","desc":"去除多余空格","formula":"=TRIM(\"  样例甲   样例乙  \")","result":"样例甲 样例乙","tip":"收拢多个普通空格为一个。","source":"people","alias":""},{"name":"CLEAN","category":"文本处理","desc":"去除不可打印字符","formula":"=CLEAN(\"A\"&CHAR(10)&\"B\")","result":"AB","tip":"去除文本中的换行控制字符。","source":"people","alias":""},{"name":"UPPER","category":"文本处理","desc":"英文字母转大写","formula":"=UPPER(\"demoa\")","result":"DEMOA","tip":"用于统一拼音大小写。","source":"files","alias":""},{"name":"LOWER","category":"文本处理","desc":"英文字母转小写","formula":"=LOWER(\"DEMOA\")","result":"demoa","tip":"用于统一命名。","source":"files","alias":""},{"name":"PROPER","category":"文本处理","desc":"英文单词首字母大写","formula":"=PROPER(\"demo item\")","result":"Demo Item","tip":"仅改变英文字母的大小写。","source":"files","alias":""},{"name":"CONCAT","category":"文本处理","desc":"拼接单元格","formula":"=CONCAT(C2,\"_\",D2)","result":"00001_Flux","tip":"适合批量生成新文件名前缀。","source":"files","alias":""},{"name":"TEXTJOIN","category":"文本处理","desc":"按分隔符拼接","formula":"=TEXTJOIN(\"-\",TRUE,C2,D2)","result":"00001-Flux","tip":"TRUE 表示忽略空值。","source":"files","alias":""},{"name":"TEXT","category":"文本处理","desc":"按指定格式显示数字","formula":"=TEXT(7,\"00000\")","result":"00007","tip":"编号补足 5 位，结果为文本。","source":"lists","alias":""},{"name":"VALUE","category":"文本处理","desc":"文本数字转数值","formula":"=VALUE(\"00125\")","result":"125","tip":"转成数值后前导零会消失。","source":"lists","alias":""},{"name":"EXACT","category":"文本处理","desc":"精确区分大小写比较","formula":"=EXACT(\"DemoA\",\"demoa\")","result":"FALSE","tip":"普通等号在 Excel 中通常不区分大小写。","source":"people","alias":""},{"name":"REPT","category":"文本处理","desc":"重复字符串","formula":"=REPT(\"0\",3)&\"12\"","result":"00012","tip":"常用来补位，也可使用 TEXT。","source":"lists","alias":""},{"name":"DATE","category":"日期时间","desc":"创建一个日期","formula":"=DATE(2026,11,19)","result":"2026-11-19","tip":"结果为 Excel 日期值，按日期格式展示。","source":"dates","alias":""},{"name":"YEAR","category":"日期时间","desc":"提取年份","formula":"=YEAR(DATE(2026,11,19))","result":"2026","tip":"提取年份数字。","source":"dates","alias":""},{"name":"MONTH","category":"日期时间","desc":"提取月份","formula":"=MONTH(DATE(2026,11,19))","result":"11","tip":"提取月份数字。","source":"dates","alias":""},{"name":"DAY","category":"日期时间","desc":"提取日","formula":"=DAY(DATE(2026,11,19))","result":"19","tip":"提取日期中第几日。","source":"dates","alias":""},{"name":"DAYS","category":"日期时间","desc":"计算相差天数","formula":"=DAYS(DATE(2026,11,9),DATE(2026,11,1))","result":"8","tip":"结束日减开始日。","source":"dates","alias":""},{"name":"DATEDIF","category":"日期时间","desc":"计算完整月份差","formula":"=DATEDIF(DATE(2026,1,1),DATE(2026,11,1),\"m\")","result":"10","tip":"m 为完整月份数量。","source":"dates","alias":""},{"name":"NETWORKDAYS","category":"日期时间","desc":"计算工作日数量","formula":"=NETWORKDAYS(A2,B2)","result":"5","tip":"2026-11-02 至 11-06 为周一至周五。未排除节假日。","source":"dates","alias":""},{"name":"WORKDAY","category":"日期时间","desc":"向后推进指定工作日","formula":"=WORKDAY(DATE(2026,11,2),5)","result":"2026-11-09","tip":"从周一起，向后计算 5 个工作日。","source":"dates","alias":""},{"name":"EOMONTH","category":"日期时间","desc":"计算月末日期","formula":"=EOMONTH(DATE(2026,11,19),0)","result":"2026-11-30","tip":"0 为当月，1 为下月。","source":"dates","alias":""},{"name":"EDATE","category":"日期时间","desc":"加减整月","formula":"=EDATE(DATE(2026,11,19),2)","result":"2027-01-19","tip":"往后推进两个月。","source":"dates","alias":""},{"name":"WEEKDAY","category":"日期时间","desc":"获取星期几","formula":"=WEEKDAY(DATE(2026,11,19),2)","result":"4","tip":"模式 2：星期一=1，星期日=7。","source":"dates","alias":""},{"name":"TODAY","category":"日期时间","desc":"返回当天日期","formula":"=TODAY()","result":"打开表格当天的日期","tip":"动态函数，每日会变化。","source":"dates","alias":""},{"name":"NOW","category":"日期时间","desc":"返回当前日期时间","formula":"=NOW()","result":"当前日期和时间","tip":"动态函数，会随计算刷新。","source":"dates","alias":""},{"name":"TEXT 日期格式","category":"日期时间","desc":"把日期格式化为文本","formula":"=TEXT(DATE(2026,11,19),\"yyyy/mm/dd\")","result":"2026/11/19","tip":"适合生成日期前缀或报表标题。","source":"dates","alias":""},{"name":"UNIQUE","category":"动态数组","desc":"从重复 ID 中提取唯一值","formula":"=UNIQUE(C2:C6)","result":"00001｜00002｜00003","tip":"一次输入，结果向下自动溢出。需要较新的 Excel / WPS 版本。","source":"lists","alias":""},{"name":"FILTER","category":"动态数组","desc":"保留所有通过的记录","formula":"=FILTER(A2:F6,E2:E6=\"通过\",\"无结果\")","result":"样例甲｜样例丙｜样例丁","tip":"返回完整匹配行，不止一个单元格。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"SORT","category":"动态数组","desc":"按照分数升序排序","formula":"=SORT(A2:F6,6,1)","result":"样例戊 → 样例乙 → 样例丙 → 样例丁 → 样例甲","tip":"6 为第 6 列分数；1 为升序。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"SORTBY","category":"动态数组","desc":"按另一列数值排序","formula":"=SORTBY(A2:B6,F2:F6,-1)","result":"样例甲 → 样例丁 → 样例丙 → 样例乙 → 样例戊","tip":"-1 为降序。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"SEQUENCE","category":"动态数组","desc":"自动生成连续数字","formula":"=SEQUENCE(5,1,1,1)","result":"1｜2｜3｜4｜5","tip":"5 行 1 列，从 1 开始，步长 1。需要较新的 Excel / WPS 版本。","source":"numbers","alias":""},{"name":"TRANSPOSE","category":"动态数组","desc":"把竖列变为横行","formula":"=TRANSPOSE(A2:A4)","result":"样例甲｜样例乙｜样例丙","tip":"将 3 行转成 3 列。","source":"people","alias":""},{"name":"CHOOSECOLS","category":"动态数组","desc":"从表格中选指定列","formula":"=CHOOSECOLS(A1:F6,1,3,4)","result":"实体｜图片数｜模型","tip":"只抽取第 1、3、4 列。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"TAKE","category":"动态数组","desc":"提取前 N 条","formula":"=TAKE(A2:F6,2)","result":"样例甲｜样例乙","tip":"只返回区域最前面的 2 行。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"DROP","category":"动态数组","desc":"跳过前 N 条","formula":"=DROP(A2:B6,3)","result":"样例丁｜样例戊","tip":"丢弃前 3 行后保留剩余行。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"HSTACK","category":"动态数组","desc":"横向拼接数组","formula":"=HSTACK(A2:A3,C2:C3)","result":"样例甲  8｜样例乙  6","tip":"横向组合两个列区域。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"VSTACK","category":"动态数组","desc":"纵向拼接数组","formula":"=VSTACK(A2:B3,A5:B6)","result":"样例甲｜样例乙｜样例丁｜样例戊","tip":"将两段行区域拼成一个表。需要较新的 Excel / WPS 版本。","source":"people","alias":""},{"name":"跨表匹配标红","category":"数据整理实战","desc":"条件表 A 列命中时，自动设为红色","formula":"=AND(G2<>\"\",COUNTIF(INDIRECT(\"'条件'!$A:$A\"),G2)>0)","result":"匹配 → 标红","tip":"用于条件格式，应用范围选 G2:G1000；示例规则不需要手动填入单元格。","source":"lists","alias":"跨表 条件格式"},{"name":"重复 ID 标红","category":"数据整理实战","desc":"给同一 ID 的所有重复行标色","formula":"=AND(C2<>\"\",COUNTIF($C$2:$C$6,C2)>1)","result":"00001 与 00003 → 标红","tip":"应用到 C2:C6 的条件格式；首次出现也标红。","source":"lists","alias":"重复值"},{"name":"唯一 ID 总数","category":"数据整理实战","desc":"统计去重后有多少 ID","formula":"=ROWS(UNIQUE(FILTER(C2:C6,C2:C6<>\"\")))","result":"3","tip":"含重复的 ID 一共只有三种。需要较新的 Excel / WPS 版本。","source":"lists","alias":"去重计数"},{"name":"跨名单查漏","category":"数据整理实战","desc":"判断待查 ID 是否缺失","formula":"=IF(COUNTIF($A$2:$A$6,B4)=0,\"缺失\",\"存在\")","result":"缺失","tip":"B4=00009，不在已确定名单中。","source":"lists","alias":"查缺"},{"name":"筛选名单交集","category":"数据整理实战","desc":"提取待查名单中已确定的 ID","formula":"=FILTER(B2:B6,COUNTIF(A2:A6,B2:B6)>0,\"无匹配\")","result":"00003｜00005｜00001","tip":"两组 ID 的交集，同时保留 B 列原始顺序。需要较新的 Excel / WPS 版本。","source":"lists","alias":"交集"},{"name":"按名单保留整行","category":"数据整理实战","desc":"根据名称列表，筛出原始表完整行","formula":"=FILTER(A2:F6,ISNUMBER(MATCH(B2:B6,{\"DemoA\",\"DemoC\"},0)),\"无结果\")","result":"样例甲｜样例丙","tip":"用虚构代号列表精确匹配；新版 Excel 可直接使用。需要较新的 Excel / WPS 版本。","source":"people","alias":"名单筛选"},{"name":"路径提取文件名","category":"数据整理实战","desc":"从完整 Windows 路径取最后文件名","formula":"=TEXTAFTER(B2,\"\\\",-1)","result":"00001_Original_Person_DemoA.png","tip":"路径有多层目录也能处理。需要较新的 Excel / WPS 版本。","source":"files","alias":"文件管理"},{"name":"路径提取上级目录","category":"数据整理实战","desc":"从完整路径提取人物或地标子目录","formula":"=TEXTBEFORE(TEXTAFTER(B2,\"\\\",-2),\"\\\")","result":"DemoA","tip":"从倒数第二个分隔符后获取目录。需要较新的 Excel / WPS 版本。","source":"files","alias":"文件夹"},{"name":"截取图像编号","category":"数据整理实战","desc":"从以五位编号开头的文件名提取 ID","formula":"=LEFT(A2,5)","result":"00001","tip":"编号以文本保存，不转成数字。","source":"files","alias":"编号"},{"name":"按模型统计数量","category":"数据整理实战","desc":"统计指定模型且状态通过的数据","formula":"=COUNTIFS(D2:D6,\"Flux\",E2:E6,\"通过\")","result":"2","tip":"用于统计模型合格样本条数。","source":"people","alias":"模型统计"},{"name":"ID 生成五位编号","category":"数据整理实战","desc":"将整数转换为带前导零的编号","formula":"=TEXT(27,\"00000\")","result":"00027","tip":"生成文本编号，方便拼接文件名。","source":"files","alias":"前导零"},{"name":"字段批量替换","category":"数据整理实战","desc":"文件名 Original 改为 Edit","formula":"=SUBSTITUTE(A2,\"Original\",\"Edit\")","result":"00001_Edit_Person_DemoA.png","tip":"文本结果不会直接重命名磁盘上的文件。","source":"files","alias":"改名"},{"name":"通过状态筛选","category":"数据整理实战","desc":"只筛通过状态的完整表格","formula":"=FILTER(A2:F6,E2:E6=\"通过\",\"无符合数据\")","result":"3 行：样例甲、样例丙、样例丁","tip":"注意对返回区域留足空白单元格。需要较新的 Excel / WPS 版本。","source":"people","alias":"合格"},{"name":"统计每个实体数量","category":"数据整理实战","desc":"以代号分组统计出现次数","formula":"=COUNTIF($B$2:$B$6,B2)","result":"1","tip":"在每一行填入后，统计该代号出现的记录数。","source":"people","alias":"分组"},{"name":"快速排序筛前两名","category":"数据整理实战","desc":"按分数倒序只保留前两行","formula":"=TAKE(SORT(A2:F6,6,-1),2)","result":"样例甲（92）｜样例丁（90）","tip":"先按分数倒序，再取两行。需要较新的 Excel / WPS 版本。","source":"people","alias":"TopN"},{"name":"多列筛选并去重","category":"数据整理实战","desc":"提取通过状态的模型清单","formula":"=UNIQUE(FILTER(D2:D6,E2:E6=\"通过\"))","result":"Flux｜SD1.5","tip":"样例甲和样例丙均为 Flux，结果去重。需要较新的 Excel / WPS 版本。","source":"people","alias":"模型去重"},{"name":"连续两条件计数","category":"数据整理实战","desc":"同一模型图片数达到要求的条数","formula":"=COUNTIFS(D2:D6,\"Flux\",C2:C6,\">=5\")","result":"2","tip":"Flux 的 8、5 满足，3 不满足。","source":"people","alias":"阈值"}];
const fixtures={"people":{"label":"模拟人物数据（全部为虚构名称）","columns":["实体","代号","图片数","模型","状态","分数"],"rows":[["样例甲","DemoA",8,"Flux","通过",92],["样例乙","DemoB",6,"SDXL","待查",78],["样例丙","DemoC",5,"Flux","通过",85],["样例丁","DemoD",8,"SD1.5","通过",90],["样例戊","DemoE",3,"Flux","不通过",61]]},"numbers":{"label":"模拟数值记录","columns":["编号","金额","数量","分组","日期","备注"],"rows":[["N01",120,3,"甲组","2026-11-01",""],["N02",200,2,"乙组","2026-11-02",""],["N03",80,5,"甲组","2026-11-03",""],["N04",160,4,"乙组","2026-11-04",""],["N05",240,1,"甲组","2026-11-05",""]]},"lists":{"label":"模拟 ID 名单（编号为文本）","columns":["确定名单","待查名单","含重复的ID"],"rows":[["00001","00003","00001"],["00002","00005","00002"],["00003","00009","00001"],["00004","00001","00003"],["00005","00007","00003"]]},"files":{"label":"模拟图像文件路径（非真实文件）","columns":["文件名","完整路径","ID","模型"],"rows":[["00001_Original_Person_DemoA.png","G:\\dataset\\Flux\\DemoA\\00001_Original_Person_DemoA.png","00001","Flux"],["00002_Original_Person_DemoB.png","G:\\dataset\\SDXL\\DemoB\\00002_Original_Person_DemoB.png","00002","SDXL"],["00003_Original_Landmark_DemoC.png","G:\\dataset\\SD1.5\\DemoC\\00003_Original_Landmark_DemoC.png","00003","SD1.5"]]},"dates":{"label":"模拟日期区间","columns":["开始日期","结束日期","项目"],"rows":[["2026-11-02","2026-11-06","任务甲"],["2026-11-05","2026-11-15","任务乙"],["2026-11-19","2026-12-03","任务丙"]]},"cross":{"label":"两个工作表的列位置示意：A 列来自“条件”，G 列来自“生成文件夹”","columns":["条件表 A","—","—","—","—","—","生成文件夹 G"],"rows":[["00001","","","","","","00003"],["00002","","","","","","00009"],["00003","","","","","","00001"],["00004","","","","","","00008"],["00005","","","","","","00005"]]}};
const categories=["查找匹配","逻辑判断","统计汇总","文本处理","日期时间","动态数组","数据整理实战"];
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={category:"全部",query:"",onlyFav:false,selected:null};
let favorite=new Set();
try{favorite=new Set(JSON.parse(localStorage.getItem("cpuck_excel_favs")||"[]"))}catch(e){}
try{if(localStorage.getItem("cpuck_excel_dark")==="1")document.documentElement.classList.add("dark")}catch(e){}
$("totalCount").textContent=library.length;
$("catCount").textContent=categories.length;
function matches(x){const key=(x.name+" "+x.desc+" "+x.category+" "+x.alias+" "+x.tip+" "+x.formula).toLowerCase();return (state.category==="全部"||x.category===state.category)&&(!state.onlyFav||favorite.has(x.name))&&key.includes(state.query.toLowerCase().trim())}
function filtered(){return library.filter(matches)}
function renderCats(){$("cats").innerHTML=["全部"].concat(categories).map(c=>'<button type="button" class="cat '+(state.category===c?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("")}
function renderItems(){const all=filtered();$("found").textContent="找到 "+all.length+" 条公式";$("favOnly").classList.toggle("active",state.onlyFav);$("favOnly").textContent=state.onlyFav?"★ 已收藏":"☆ 只看收藏";$("items").innerHTML=all.length?all.map(x=>'<div class="item '+(state.selected===x.name?'on':'')+'" data-open="'+esc(x.name)+'" role="button" tabindex="0" aria-label="查看 '+esc(x.name)+'"><div class="itemmain"><div><span class="itemtitle">'+esc(x.name)+'</span><span class="itemcat">'+esc(x.category)+'</span></div><div class="itemdesc">'+esc(x.desc)+'</div><div class="itemresult">结果：'+esc(x.result)+'</div></div><button class="star '+(favorite.has(x.name)?'on':'')+'" data-star="'+esc(x.name)+'" type="button" aria-label="'+(favorite.has(x.name)?"取消收藏":"收藏")+'">'+(favorite.has(x.name)?"★":"☆")+'</button></div>').join(""):'<p class="empty">未找到符合条件的函数。<br>可换个关键词，或取消分类筛选。</p>';if(all.length&&!all.some(x=>x.name===state.selected))state.selected=all[0].name; if(!all.length)state.selected=null; renderDetail()}
function colLetter(i){let s="";for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}
function refsFor(f){const ref=new Set();const p=/(?:^|[^A-Z0-9_])(\$?([A-F])\$?(\d+))(?:\s*:\s*\$?([A-F])\$?(\d+))?/g;let m;while((m=p.exec(f))){let a=m[2].charCodeAt(0)-65,b=+m[3],c=m[4]?m[4].charCodeAt(0)-65:a,d=m[5]?+m[5]:b;for(let i=Math.min(a,c);i<=Math.max(a,c);i++)for(let j=Math.min(b,d);j<=Math.max(b,d)&&j<20;j++)ref.add(colLetter(i)+j)}return ref}
function renderTable(x){const fixture=fixtures[x.source]||fixtures.people;const ref=refsFor(x.formula);let s='<p class="sheetcaption">'+esc(fixture.label)+' · 蓝色淡底标注可能涉及的引用单元格</p><div class="sheetwrap"><table class="sheet"><thead><tr><th class="rownum"></th>';for(let c=0;c<fixture.columns.length;c++)s+='<th>'+colLetter(c)+'</th>';s+='</tr></thead><tbody><tr><th class="rownum">1</th>';for(let c=0;c<fixture.columns.length;c++)s+='<td>'+esc(fixture.columns[c])+'</td>';s+='</tr>';fixture.rows.forEach((row,i)=>{s+='<tr><th class="rownum">'+(i+2)+'</th>';row.forEach((v,j)=>{const full=String(v);s+='<td title="'+esc(full)+'" class="'+(ref.has(colLetter(j)+(i+2))?'refcell':'')+'">'+esc(full)+'</td>'});s+='</tr>'});return s+'</tbody></table></div>'}
function renderDetail(){let x=library.find(v=>v.name===state.selected);if(!x){$("detail").innerHTML='<div class="empty">选择一个函数查看示例</div>';return}const i=filtered().findIndex(y=>y.name===x.name);$("detail").innerHTML='<div class="dtop"><div class="dtitle"><div><span class="subpill">'+esc(x.category)+'</span><h2>'+esc(x.name)+'</h2></div></div><p>'+esc(x.desc)+'</p></div><div class="section"><h3><span class="numb">1</span> 可以直接复制的公式</h3><div class="codebar"><code class="formula">'+esc(x.formula)+'</code><button class="copy" type="button" id="copyFormula">复制公式</button></div></div><div class="section"><h3><span class="numb">2</span> 原始数据表格</h3>'+renderTable(x)+'</div><div class="section"><h3><span class="numb">3</span> 预期效果 / 返回值</h3><div class="resultbox"><span class="arrow">→</span><span class="value">'+esc(x.result)+'</span></div></div><div class="section"><h3><span class="numb">✓</span> 使用说明</h3><div class="notice">'+esc(x.tip)+'</div></div><div class="detailnav"><button type="button" id="prev" '+(i<=0?'disabled':'')+'>← 上一个</button><button type="button" id="next" '+(i>=filtered().length-1?'disabled':'')+'>下一个 →</button></div>'; $("copyFormula").addEventListener("click",()=>copy(x.formula));$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1))}
function move(delta){let arr=filtered(),i=arr.findIndex(x=>x.name===state.selected);if(arr[i+delta])select(arr[i+delta].name)}
function select(name){state.selected=name;renderItems();try{history.replaceState(null,"","#"+encodeURIComponent(name))}catch(e){}if(innerWidth<951)$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
async function copy(value){try{await navigator.clipboard.writeText(value)}catch(err){const t=document.createElement("textarea");t.value=value;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}const b=$("copyFormula");if(b){b.textContent="已复制 ✓";setTimeout(()=>{if(b.isConnected)b.textContent="复制公式"},1200)}}
$("items").addEventListener("click",e=>{const star=e.target.closest("[data-star]");if(star){const n=star.getAttribute("data-star");favorite.has(n)?favorite.delete(n):favorite.add(n);try{localStorage.setItem("cpuck_excel_favs",JSON.stringify([...favorite]))}catch(err){}renderItems();return}const item=e.target.closest("[data-open]");if(item)select(item.getAttribute("data-open"))});
$("items").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();select(e.target.getAttribute("data-open"))}});
$("cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;state.category=b.getAttribute("data-cat");renderCats();renderItems()});
$("query").addEventListener("input",e=>{state.query=e.target.value;$("clear").hidden=!state.query;renderItems()});
$("clear").addEventListener("click",()=>{state.query="";$("query").value="";$("clear").hidden=true;renderItems();$("query").focus()});
$("favOnly").addEventListener("click",()=>{state.onlyFav=!state.onlyFav;renderItems()});
$("themeBtn").addEventListener("click",()=>{const dark=document.documentElement.classList.toggle("dark");try{localStorage.setItem("cpuck_excel_dark",dark?"1":"0")}catch(e){}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&e.target.tagName!=="INPUT"){e.preventDefault();$("query").focus()}});
const fromHash=decodeURIComponent(location.hash.slice(1));state.selected=library.some(x=>x.name===fromHash)?fromHash:library[0].name;renderCats();renderItems();
</script>
