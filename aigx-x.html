  function memStore() {
    const data=new Map();
    return {get length(){return data.size;},key(i){return Array.from(data.keys())[i]??null;},
      getItem(k){return data.has(String(k))?data.get(String(k)):null;},
      setItem(k,v){data.set(String(k),String(v));},removeItem(k){data.delete(String(k));},clear(){data.clear();}};
  }

    try { const st=window[name]; const key='__aigx_probe_';st.setItem(key,'1');st.removeItem(key); }

    <title>MDE Markdown 工作台</title>
    <style>
        :root {
            --bg-body: #020617;
            --bg-card: rgba(15, 23, 42, 0.78);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --theme-blue: #38bdf8;
            --theme-purple: #a78bfa;
            --theme-green: #34d399;
            --border-light: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-body);

            display: flex;

        .panel {

            overflow: hidden;

        /* 侧边栏折叠状态 */
        .panel.collapsed {
            margin-left: -344px; /* 330px 宽度 + 14px 间距 */

            min-width: 0;

        .panel-scroll { flex: 1 1 auto; min-height: 0; padding: 22px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }

        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; margin-bottom: 18px; }
        .brand-mark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--theme-blue), var(--theme-purple)); color: #020617; }

        .preview h1, .preview h2, .preview h3 { margin: 1.1em 0 0.55em; line-height: 1.25; }
        .preview h1 { font-size: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.3em; }
        .preview h2 { font-size: 1.45rem; }
        .preview h3 { font-size: 1.18rem; }

        .preview img, .preview video { max-width: 100%; border-radius: 14px; border: 1px solid var(--border-light); margin: 10px 0; }
        .preview a { color: #7dd3fc; }
        .media-preview { display: grid; gap: 10px; margin-top: 10px; }
        .media-preview img, .media-preview video { width: 100%; max-height: 170px; object-fit: contain; border: 1px solid var(--border-light); border-radius: 12px; background: rgba(0, 0, 0, 0.28); }
        .small { font-size: 0.78rem; color: var(--text-tertiary); line-height: 1.55; }

        @media (max-width: 980px) {

        }

</style>

<body>
    <div class="workspace">

        <aside class="panel" id="sidePanel">
            <div class="panel-scroll">
                <p class="hint">一个图片入口，支持原图插入 Markdown、AI 改图和连续编辑。</p>
                <div class="workspace-section-title">对话 API 配置</div>

                <div class="form-group">
                    <label for="apiKey">🔑 对话 API Key</label>
                    <div class="key-input-row"><input id="apiKey" class="glass-input" type="password" placeholder="请输入你的 API Key" autocomplete="off"><button class="key-toggle" id="toggleChatKey" type="button">显示</button></div>
                </div>
                <div class="form-group">
                    <label for="apiBaseUrl">🌐 API URL</label>
                    <input id="apiBaseUrl" class="glass-input" value="https://api.poixe.com/v1/" placeholder="https://api.poixe.com/v1/">
                </div>
                <div class="form-group">
                    <label for="modelName">🤖 自定义对话模型</label>
                    <input id="modelName" class="glass-input" value="deepseek-v4-flash" placeholder="例如：deepseek-v4-flash / gpt-4.1">
                </div>

                <div class="form-group">
                    <label for="chatPrompt">💬 API 对话</label>
                    <textarea id="chatPrompt" class="glass-input" rows="3" placeholder="输入问题，使用上方自定义 API 地址、密钥和模型进行对话…"></textarea>
                    <div class="chat-actions">
                        <button class="btn" id="chatSendBtn" type="button">发送对话</button>
                        <button class="btn secondary" id="chatInsertBtn" type="button" disabled>插入回答到 MD</button>
                    </div>
                    <div id="chatStatus" class="chat-status">支持 OpenAI 兼容的 /v1/chat/completions 接口。</div>
                    <div id="chatLog" class="chat-log" aria-live="polite"><div class="chat-empty">对话内容会显示在这里。回答可一键插入 Markdown。</div></div>
                    <div style="display:flex;justify-content:flex-end;margin-top:8px">
                        <button class="btn secondary" id="chatClearBtn" type="button" style="height:32px;font-size:.76rem">清空对话</button>
                    </div>
                </div>

                <div class="divider"></div>
                <div class="workspace-section-title">图像生成与编辑</div>
                <div class="form-group">
                    <label for="imageModel">🎨 生成模型</label>
                    <select id="imageModel" class="glass-input">
                        <option value="gpt">GPT Image 2 · APIMart</option>
                        <option value="qwen">Qwen Image 2.1 · Hugging Face</option>
                    </select>
                </div>

                <section class="image-settings" id="imageGptSettings">
                    <div class="form-group">
                        <label for="imageApiKey">APIMart API Key</label>
                        <div class="key-input-row"><input id="imageApiKey" class="glass-input" type="password" placeholder="粘贴你的 APIMart API Key" autocomplete="off"><button class="key-toggle" id="toggleImageApiKey" type="button">显示</button></div>
                    </div>
                    <div class="form-group">
                        <label for="imageApiBaseUrl">图像 API Base URL</label>
                        <input id="imageApiBaseUrl" class="glass-input" type="url" value="https://api.apimart.ai" placeholder="https://api.apimart.ai">
                    </div>
                    <div class="form-group">
                        <label for="imageModelId">图像模型 ID</label>
                        <input id="imageModelId" class="glass-input" value="gpt-image-2-ext" placeholder="gpt-image-2-ext">
                    </div>
                    <label style="display:flex;align-items:center;gap:7px;font-size:.76rem;text-transform:none;letter-spacing:0">
                        <input id="rememberImageKey" type="checkbox"> 在此浏览器记住图像 API Key
                    </label>
                </section>

                <section class="image-settings" id="imageQwenSettings" hidden>
                    <div class="form-group">
                        <label for="hfToken">Hugging Face Token（可选）</label>
                        <div class="key-input-row"><input id="hfToken" class="glass-input" type="password" placeholder="hf_...；公开 Space 可留空" autocomplete="off"><button class="key-toggle" id="toggleHfToken" type="button">显示</button></div>
                        <p class="small"><a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener noreferrer">获取 Hugging Face Token ↗</a>；公开 Space 通常可留空。</p>
                    </div>
                    <div class="image-row">
                        <div class="form-group">
                            <label for="qwenSteps">推理步数</label>
                            <select id="qwenSteps" class="glass-input"><option value="28">28 · 快速</option><option value="40" selected>40 · 推荐</option></select>
                        </div>
                        <div class="form-group">
                            <label for="qwenSeed">随机种子</label>
                            <input id="qwenSeed" class="glass-input" type="number" min="0" max="2147483647" value="42">
                        </div>
                    </div>
                    <label style="display:flex;align-items:center;gap:7px;font-size:.76rem;text-transform:none;letter-spacing:0">
                        <input id="randomSeed" type="checkbox" checked> 每次使用新随机种子
                    </label>
                    <label style="display:flex;align-items:center;gap:7px;font-size:.76rem;text-transform:none;letter-spacing:0;margin-top:8px">
                        <input id="rememberHfToken" type="checkbox"> 在此浏览器记住 HF Token
                    </label>
                    <p class="small">Space：assembledchaos/qwen-image-2-1-studio</p>
                </section>

                <div class="image-row">
                    <div class="form-group" id="imageResolutionGroup">
                        <label for="imageResolution">生成分辨率（GPT Image 2）</label>
                        <select id="imageResolution" class="glass-input"><option value="1k">1K</option><option value="2k">2K</option><option value="4k">4K</option></select>
                    </div>
                    <div class="form-group">
                        <label for="imageAspect">画面比例</label>
                        <select id="imageAspect" class="glass-input">
                            <option value="1:1">1:1</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="21:9">21:9</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="imageTaskMode">任务模式</label>
                    <select id="imageTaskMode" class="glass-input">
                        <option value="auto">自动判断（推荐）</option><option value="create">文生图</option><option value="edit">图像编辑</option><option value="transparent" id="imageTransparentOption">透明 PNG（仅 Qwen）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="imagePrompt">提示词 / 编辑指令 <span class="prompt-count" id="imagePromptCount">0 字</span></label>
                    <textarea id="imagePrompt" class="glass-input" rows="4" placeholder="描述想生成的画面，或说明如何修改参考图片…"></textarea>
                </div>
                <div class="form-group">
                    <label for="imageInput">图片上传（统一入口）</label>
                    <div class="image-upload-drop" id="imageUploadDrop"><input id="imageInput" class="glass-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><p class="small">选择或拖入一张图片；载入后可插入 MD，也可直接输入指令进行 AI 改图</p></div>
                    <div class="image-source" id="imageSourcePreview">
                        <img id="imageSourceThumb" alt="参考图预览">
                        <div class="image-source-info" id="imageSourceInfo">参考图片已载入</div>
                        <button class="btn secondary" id="removeImageSource" type="button">移除</button>
                    </div>
                    <button class="btn secondary full" id="insertSourceImageBtn" type="button" disabled style="margin-top:8px">插入原图到 MD</button>
                </div>
                <div class="actions">
                    <button class="btn purple" id="generateImageBtn" type="button">✦ 生成图片</button>
                    <button class="btn secondary" id="insertImageBtn" type="button" disabled>插入 MD</button>
                </div>
                <div class="image-actions">
                    <button class="btn secondary" id="downloadImageBtn" type="button" disabled>下载图片</button>

        function openWebPreview() {

        function copyContent() {
            const text = document.getElementById('markdownInput').value;
            if (!text) return alert('当前没有可复制的内容！');

            // 尝试现代 API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => alert('✅ 已复制全文至剪贴板'))
                    .catch(() => fallbackCopyTextToClipboard(text));
            } else {
                // 降级使用传统 API (解决 HTTP 环境下的兼容性问题)
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // 防止页面滚动
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert('✅ 已复制全文至剪贴板');
            } catch (err) {
                alert('❌ 复制失败，请在编辑器中手动全选复制 (Ctrl+A / Ctrl+C)');
            }
            document.body.removeChild(textArea);
        }

            const a = document.createElement('a');
            a.href = url;
            a.download = `Document_${Date.now()}.md`;

        function getDocumentBaseName() {
            const text = getTextarea().value || '';
            const match = text.match(/^#\s+(.+)$/m);
            const name = (match ? match[1] : 'MDE_Document').replace(/[\\/:*?"<>|]/g, '_').trim();
            return (name || 'MDE_Document').slice(0, 80);

        function saveBlobAsFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function loadExternalScript(src, isReady) {
            if (isReady()) return Promise.resolve();
            return new Promise((resolve, reject) => {
                let existing = Array.from(document.scripts).find(item => item.src === src);
                if (existing && isReady()) { resolve(); return; }
                if (existing && existing.dataset.failed === 'true') { existing.remove(); existing = null; }
                if (existing && existing.dataset.loaded === 'true') {
                    reject(new Error('组件已加载，但初始化失败：' + src));
                    return;
                }
                if (existing) {
                    existing.addEventListener('load', () => resolve(), { once: true });
                    existing.addEventListener('error', () => reject(new Error('组件加载失败：' + src)), { once: true });
                    return;
                }
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => { script.dataset.loaded = 'true'; resolve(); };
                script.onerror = () => { script.dataset.failed = 'true'; script.remove(); reject(new Error('组件加载失败，请检查网络或 CDN：' + src)); };
                document.head.appendChild(script);
            });
        }

        function docxInlineRuns(text, lib) {
            const parts = String(text || '').replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '$1（图片链接：$2）')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1（$2）')
                .split(/(\*\*[^*]+\*\*|__[^_]+__|\x60[^\x60]+\x60|\*[^*]+\*|_[^_]+_)/g)
                .filter(Boolean);
            return parts.map(part => {
                let value = part, options = { font: 'Microsoft YaHei', size: 22 };
                if ((part.startsWith('**') && part.endsWith('**')) || (part.startsWith('__') && part.endsWith('__'))) {
                    value = part.slice(2, -2);
                    options.bold = true;
                } else if (part.charCodeAt(0) === 96 && part.charCodeAt(part.length - 1) === 96) {
                    value = part.slice(1, -1);
                    options.font = 'Consolas';
                    options.color = '475569';
                    options.size = 20;
                } else if ((part.startsWith('*') && part.endsWith('*')) || (part.startsWith('_') && part.endsWith('_'))) {
                    value = part.slice(1, -1);
                    options.italics = true;
                }
                options.text = value;
                return new lib.TextRun(options);
            });
        }

        async function markdownToDocxBlocks(markdown, lib) {
            const lines = String(markdown || '').replace(/\r/g, '').split('\n');
            const children = [];
            let codeLines = [];
            let inCode = false;
            let tableLines = [];

            const paragraph = (text, extra) => new lib.Paragraph(Object.assign({
                children: docxInlineRuns(text, lib),
                spacing: { after: 140, line: 300 }
            }, extra || {}));

            const flushCode = () => {
                if (!codeLines.length) return;
                children.push(new lib.Paragraph({
                    children: [new lib.TextRun({
                        text: codeLines.join('\n'),
                        font: 'Consolas',
                        size: 18,
                        color: '334155'
                    })],
                    indent: { left: 180, right: 180 },
                    spacing: { before: 100, after: 180 }
                }));
                codeLines = [];
            };

            const parseCells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
            const flushTable = () => {
                if (!tableLines.length) return;
                const rows = tableLines.map(parseCells).filter(cells => !cells.every(cell => /^:?-{3,}:?$/.test(cell)));
                if (rows.length) {
                    const colCount = Math.max(1, ...rows.map(row => row.length));
                    const border = { style: lib.BorderStyle.SINGLE, size: 1, color: 'CBD5E1' };
                    const borders = { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border };
                    children.push(new lib.Table({
                        width: { size: 100, type: lib.WidthType.PERCENTAGE },
                        columnWidths: Array(colCount).fill(Math.floor(9000 / colCount)),
                        borders,
                        rows: rows.map((cells, rowIndex) => new lib.TableRow({
                            cantSplit: true,
                            children: Array.from({ length: colCount }, (_, colIndex) => new lib.TableCell({
                                width: { size: Math.floor(100 / colCount), type: lib.WidthType.PERCENTAGE },
                                margins: { top: 80, bottom: 80, left: 100, right: 100 },
                                shading: rowIndex === 0 ? { fill: 'EAF2F8' } : undefined,
                                children: [new lib.Paragraph({
                                    children: docxInlineRuns(cells[colIndex] || '', lib),
                                    spacing: { after: 40 }
                                })]
                            }))
                        }))
                    }));
                    children.push(new lib.Paragraph({ children: [new lib.TextRun('')], spacing: { after: 100 } }));
                }
                tableLines = [];
            };

            for (const line of lines) {
                if (/^\s*\x60{3}/.test(line)) {
                    flushTable();
                    if (inCode) flushCode();
                    inCode = !inCode;
                    continue;
                }
                if (inCode) {
                    codeLines.push(line);
                    continue;
                }
                if (/^\s*\|.*\|\s*$/.test(line)) {
                    tableLines.push(line);
                    continue;
                }
                flushTable();
                if (!line.trim()) continue;

                const image = line.match(/^\s*!\[([^\]]*)\]\((.+)\)\s*$/);
                if (image) {
                    try {
                        const response = await fetch(image[2]);
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        const blob = await response.blob();
                        const bytes = new Uint8Array(await blob.arrayBuffer());
                        let width = 520, height = 340;
                        try {
                            const bitmap = await createImageBitmap(blob);
                            const scale = Math.min(1, 560 / bitmap.width, 420 / bitmap.height);
                            width = Math.max(1, Math.round(bitmap.width * scale));
                            height = Math.max(1, Math.round(bitmap.height * scale));
                            bitmap.close();
                        } catch (error) {}
                        children.push(new lib.Paragraph({
                            children: [new lib.ImageRun({
                                data: bytes,
                                transformation: { width: width, height: height }
                            })],
                            alignment: lib.AlignmentType.CENTER,
                            spacing: { before: 100, after: 160 }
                        }));
                    } catch (error) {
                        children.push(paragraph('图片：' + image[1] + '（图片链接：' + image[2] + '）'));
                    }
                    continue;
                }

                const heading = line.match(/^(#{1,6})\s+(.+)$/);
                if (heading) {
                    const level = heading[1].length;
                    const headingLevels = [
                        null,
                        lib.HeadingLevel.HEADING_1,
                        lib.HeadingLevel.HEADING_2,
                        lib.HeadingLevel.HEADING_3,
                        lib.HeadingLevel.HEADING_4,
                        lib.HeadingLevel.HEADING_5,
                        lib.HeadingLevel.HEADING_6
                    ];
                    children.push(paragraph(heading[2], {
                        heading: headingLevels[level],
                        spacing: { before: 220, after: 120 }
                    }));
                    continue;
                }
                if (/^\s*[-*+]\s+/.test(line)) {
                    children.push(paragraph('•  ' + line.replace(/^\s*[-*+]\s+/, ''), { indent: { left: 360, hanging: 180 } }));
                    continue;
                }
                const ordered = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
                if (ordered) {
                    children.push(paragraph(ordered[1] + '.  ' + ordered[2], { indent: { left: 360, hanging: 180 } }));
                    continue;
                }
                if (/^\s*>\s?/.test(line)) {
                    children.push(paragraph(line.replace(/^\s*>\s?/, ''), {
                        indent: { left: 420 },
                        border: { left: { color: '38BDF8', space: 8, style: lib.BorderStyle.SINGLE, size: 16 } }
                    }));
                    continue;
                }
                if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
                    children.push(new lib.Paragraph({ border: { bottom: { color: 'CBD5E1', style: lib.BorderStyle.SINGLE, size: 6 } }, spacing: { after: 180 } }));
                    continue;
                }
                children.push(paragraph(line));
            }
            if (inCode) flushCode();
            flushTable();
            if (!children.length) children.push(new lib.Paragraph({ children: [new lib.TextRun(' ')] }));
            return children;
        }

        async function downloadWord() {
            const button = document.querySelector('[onclick="downloadWord()"]');
            if (button) button.disabled = true;
            try {
                await loadExternalScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', () => !!window.docx);
                const lib = window.docx;
                if (!lib || !lib.Document || !lib.Packer) throw new Error('Word 文档组件未正确加载。');
                const doc = new lib.Document({
                    styles: {
                        default: {
                            document: {
                                run: { font: 'Microsoft YaHei', size: 22, color: '1F2937' },
                                paragraph: { spacing: { after: 140, line: 300 } }
                            }
                        }
                    },
                    sections: [{
                        properties: { page: { margin: { top: 900, right: 900, bottom: 900, left: 900 } } },
                        children: await markdownToDocxBlocks(getTextarea().value, lib)
                    }]
                });
                const blob = await lib.Packer.toBlob(doc);
                saveBlobAsFile(blob, getDocumentBaseName() + '.docx');
            } catch (error) {
                alert('Word 导出失败：' + (error.message || error));
            } finally {
                if (button) button.disabled = false;
            }
        }

        async function waitForPdfImages(root) {
            const images = Array.from(root.querySelectorAll('img'));
            await Promise.all(images.map(img => new Promise(resolve => {
                let done = false;
                const finish = () => {
                    if (done) return;
                    done = true;
                    if (!img.naturalWidth && img.parentNode) {
                        const fallback = document.createElement('div');
                        fallback.className = 'pdf-image-fallback';
                        fallback.textContent = img.alt ? '图片：' + img.alt : '图片加载失败';
                        img.replaceWith(fallback);
                    }
                    resolve();
                };
                if (img.complete) { finish(); return; }
                img.addEventListener('load', finish, { once: true });
                img.addEventListener('error', finish, { once: true });
                setTimeout(finish, 12000);
            })));

        // --- 基础工具与 Markdown 解析 ---
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function inlineMarkdown(text) {
            return escapeHtml(text)
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function renderMarkdown(markdown) {
            const lines = markdown.split('\n');
            const html = [];
            let inCode = false; let codeLines = [];
            let inUl = false; let inOl = false; let inTable = false; let tableHasHeader = false;

            const closeLists = () => { if (inUl) { html.push('</ul>'); inUl = false; } if (inOl) { html.push('</ol>'); inOl = false; } };
            const closeTable = () => { if (inTable) { html.push('</tbody></table>'); inTable = false; tableHasHeader = false; } };

            lines.forEach((line) => {
                if (line.trim().startsWith('```')) {
                    if (inCode) {
                        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                        codeLines = []; inCode = false;
                    } else { closeLists(); closeTable(); inCode = true; }
                    return;
                }
                if (inCode) { codeLines.push(line); return; }

                const trimmed = line.trim();
                if (!trimmed) { closeLists(); closeTable(); return; }

                if (/^\|(.+)\|$/.test(trimmed)) {
                    closeLists();
                    const cells = trimmed.slice(1, -1).split('|').map(cell => inlineMarkdown(cell.trim()));
                    if (cells.every(cell => /^:?-{3,}:?$/.test(cell))) return;
                    if (!inTable) { html.push('<table><tbody>'); inTable = true; tableHasHeader = false; }
                    const tag = tableHasHeader ? 'td' : 'th';
                    tableHasHeader = true;
                    html.push(`<tr>${cells.map(cell => `<${tag}>${cell}</${tag}>`).join('')}</tr>`);
                    return;
                }
                closeTable();

                const rawVideo = trimmed.match(/^<video\s+src=["']([^"']+)["']\s+controls><\/video>$/i);
                if (rawVideo && /^(blob:|https?:|data:video\/)/i.test(rawVideo[1])) {
                    closeLists(); html.push(`<video src="${escapeHtml(rawVideo[1])}" controls></video>`); return;
                }

                const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
                if (heading) {
                    closeLists();
                    const level = heading[1].length;
                    html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
                    return;
                }
                if (/^>\s?/.test(trimmed)) {
                    closeLists(); html.push(`<blockquote>${inlineMarkdown(trimmed.replace(/^>\s?/, ''))}</blockquote>`); return;
                }
                if (/^[-*+]\s+/.test(trimmed)) {
                    if (!inUl) { closeLists(); html.push('<ul>'); inUl = true; }
                    html.push(`<li>${inlineMarkdown(trimmed.replace(/^[-*+]\s+/, ''))}</li>`); return;
                }
                if (/^\d+\.\s+/.test(trimmed)) {
                    if (!inOl) { closeLists(); html.push('<ol>'); inOl = true; }
                    html.push(`<li>${inlineMarkdown(trimmed.replace(/^\d+\.\s+/, ''))}</li>`); return;
                }
                closeLists(); html.push(`<p>${inlineMarkdown(trimmed)}</p>`);
            });

            if (inCode) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            closeLists(); closeTable();
            return html.join('\n');
        }

        function insertAtCursor(text) {
            const area = getTextarea();
            const start = area.selectionStart;
            const end = area.selectionEnd;
            area.value = area.value.slice(0, start) + text + area.value.slice(end);
            area.focus();
            area.selectionStart = area.selectionEnd = start + text.length;
            return handleInput();
        }

        function wrapSelection(prefix, suffix) {
            const area = getTextarea();
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const selected = area.value.slice(start, end) || '文本';
            const next = prefix + selected + suffix;
            area.value = area.value.slice(0, start) + next + area.value.slice(end);
            area.focus();
            area.selectionStart = start + prefix.length;
            area.selectionEnd = start + prefix.length + selected.length;
            handleInput();
        }

        function wrapLine(prefix, suffix) {
            const area = getTextarea();
            const lineStart = area.value.lastIndexOf('\n', area.selectionStart - 1) + 1;
            area.value = area.value.slice(0, lineStart) + prefix + area.value.slice(lineStart) + suffix;
            area.focus();
            area.selectionStart = area.selectionEnd = lineStart + prefix.length;
            handleInput();
        }

        // --- AI API 调用逻辑 ---
        async function runAiEdit(mode) {
            const apiKey = document.getElementById('apiKey').value.trim();
            const endpoint = getChatApiEndpoint();
            const model = document.getElementById('modelName').value.trim() || 'deepseek-v4-flash';
            const doc = getTextarea().value.trim();
            const instruction = document.getElementById('aiInstruction').value;
            const customInstruction = document.getElementById('customInstruction').value.trim();
            const status = document.getElementById('aiStatus');
            const buttons = [document.getElementById('aiReplaceBtn'), document.getElementById('aiAppendBtn')];

            if (!apiKey) { alert('请先填写 API Key'); return; }
            if (!doc) { alert('请先输入内容'); return; }

            buttons.forEach(btn => btn.disabled = true);
            status.innerText = '引擎解析处理中...';
            saveSettings();

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model,
                        messages: [
                            { role: 'system', content: '你是专业的文档排版与处理助手。直接输出修改后的结果内容，严禁输出任何寒暄或废话。除非用户文本当中本身包含 markdown 代码块包裹，否则你绝对不要使用 ``` 标记来包裹你的回复全文。' },
                            { role: 'user', content: `${instruction}\n${customInstruction ? `补充要求：${customInstruction}\n` : ''}\n---\n${doc}` }
                        ],
                        max_tokens: 8192
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData?.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                let result = data.choices?.[0]?.message?.content?.trim();

                // 去除可能被大模型错误包裹的代码块标记
                if(result && result.startsWith('```') && result.endsWith('```')){
                    result = result.replace(/^```[\w-]*\n/, '').replace(/\n```$/, '');
                }

                if (!result) throw new Error('API 未返回有效内容');

                if (mode === 'replace') getTextarea().value = result;
                else getTextarea().value += `\n\n---\n\n${result}`;

                handleInput();
                status.innerText = `完成：耗费 ${data.usage?.total_tokens || '未知'} Tokens`;
            } catch (err) {
                status.innerText = `失败：${err.message}`;
                alert(`模型处理失败：${err.message}`);
            } finally {
                buttons.forEach(btn => btn.disabled = false);
            }
        }

        async function sendChatPrompt() {
            const input = document.getElementById('chatPrompt');
            const prompt = input.value.trim();
            const key = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelName').value.trim() || 'deepseek-v4-flash';
            const status = document.getElementById('chatStatus');
            const sendButton = document.getElementById('chatSendBtn');
            if (!prompt) { status.textContent = '请先输入对话内容。'; return; }
            if (!key) { status.textContent = '请先填写上方对话 API Key。'; return; }
            const userMessage = { role: 'user', content: prompt };
            chatHistory.push(userMessage);
            input.value = '';
            renderChatLog();
            sendButton.disabled = true;
            status.textContent = '正在请求 ' + model + ' …';
            try {
                saveSettings();
                const response = await fetch(getChatApiEndpoint(), {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'system', content: '你是一个准确、清晰的 AI 助手。请直接回答用户问题。' }].concat(chatHistory.slice(-16)),
                        max_tokens: 8192
                    })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data?.error?.message || data?.message || ('HTTP ' + response.status));
                const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
                const reply = Array.isArray(content) ? content.map(part => part.text || '').join('') : String(content || '').trim();
                if (!reply) throw new Error('API 未返回有效文本。');
                chatHistory.push({ role: 'assistant', content: reply });
                lastChatReply = reply;
                document.getElementById('chatInsertBtn').disabled = false;
                renderChatLog();
                status.textContent = '完成 · ' + (data.usage && data.usage.total_tokens ? data.usage.total_tokens + ' Tokens' : model);
            } catch (error) {
                const index = chatHistory.lastIndexOf(userMessage);
                if (index >= 0) chatHistory.splice(index, 1);
                input.value = prompt;
                renderChatLog();
                status.textContent = '请求失败：' + (error.message || error) + '。已保留输入，可修改后重试。';
            } finally {
                sendButton.disabled = false;
            }
        }

            document.getElementById('insertSourceImageBtn').disabled = false;
            updateImageTaskLabel();
        }

        function clearImageSource() {
            if (imageSourceObjectUrl) URL.revokeObjectURL(imageSourceObjectUrl);
            imageSourceObjectUrl = '';
            imageSourceBlob = null;
            imageSourceName = '';
            document.getElementById('imageInput').value = '';
            document.getElementById('imageSourcePreview').classList.remove('show');
            document.getElementById('imageSourceThumb').removeAttribute('src');
            document.getElementById('insertSourceImageBtn').disabled = true;
            updateImageTaskLabel();
        }

        async function imageJpegData(blob) {
            if (!blob) throw new Error('请先上传参考图片。');
            const objectUrl = URL.createObjectURL(blob);
            try {
                const image = new Image();
                await new Promise((resolve, reject) => {
                    image.onload = resolve;
                    image.onerror = () => reject(new Error('参考图片无法读取。'));
                    image.src = objectUrl;
                });
                const ratio = Math.min(1, 1536 / Math.max(image.naturalWidth, image.naturalHeight));
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
                canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
                const context = canvas.getContext('2d');
                if (!context) throw new Error('无法创建图片画布。');
                context.fillStyle = '#fff';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.85);
            } finally {
                URL.revokeObjectURL(objectUrl);
            }
        }

        async function imageBlobDataUrl(blob) {
            if (!blob || !/^image\//i.test(blob.type || '')) throw new Error('读取对象不是有效图片。');
            return await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const value = reader.result;
                    if (typeof value === 'string' && /^data:image\//i.test(value)) resolve(value);
                    else reject(new Error('图片数据读取失败。'));
                };
                reader.onerror = () => reject(new Error('浏览器无法读取该图片文件。'));
                reader.readAsDataURL(blob);
            });
        }

        function markdownImageAlt(name) {
            return String(name || '图片')
                .replace(/[\r\n\[\]()]/g, '-')
                .replace(/\\/g, '-')
                .trim() || '图片';
        }

        async function insertSourceImageIntoMarkdown() {
            if (!imageSourceBlob) {
                imageStatus('请先选择一张图片。', 'error');
                return;
            }
            const button = document.getElementById('insertSourceImageBtn');
            button.disabled = true;
            button.textContent = '图片处理中…';
            try {
                const dataUrl = await imageBlobDataUrl(imageSourceBlob);
                const saved = insertAtCursor('\n![' + markdownImageAlt(imageSourceName) + '](' + dataUrl + ')\n');
                if (saved === false) {
                    imageStatus('图片已插入 Markdown，但文档较大，浏览器本地缓存可能已满；请立即导出 MD 备份。', 'error');
                } else {
                    imageStatus('原图已完整嵌入 Markdown，保留原格式且无需图床链接；可继续使用同一张图进行 AI 编辑。', 'success');
                }
            } catch (error) {
                imageStatus('原图插入失败：' + (error.message || error), 'error');
            } finally {
                button.disabled = !imageSourceBlob;
                button.textContent = '插入原图到 MD';
            }
        }

        async function imageApiJson(url, options) {
            let response;
            try {
                response = await fetch(url, options);
            } catch (error) {
                throw new Error('网络或跨域访问失败：' + error.message + '。请检查网络、API 地址和服务商 CORS 设置。');
            }
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch (error) {
                throw new Error('接口返回非 JSON（HTTP ' + response.status + '）：' + raw.slice(0, 220));
            }
            const payload = data && typeof data === 'object' ? data : {};
            if (!response.ok) {
                const err = payload.error || (payload.data && payload.data.error);
                const message = typeof err === 'string' ? err : (err && err.message) || payload.message || raw.slice(0, 250) || '接口未提供错误详情';
                if (response.status === 403 && /quota is not enough|token quota|insufficient.*(balance|quota)|quota.*(balance|insufficient)/i.test(String(message))) {
                    throw new Error('APIMart 返回 HTTP 403：API Key 的 Token 额度或账户余额不足。');
                }
                throw new Error('HTTP ' + response.status + '：' + message);
            }
            return payload;
        }

        function getGeneratedImageUrl(data) {
            const item = Array.isArray(data && data.data) ? data.data[0] : (data && data.data) || data || {};
            const values = [
                item.url, item.image_url, item.b64_json,
                item.result && item.result.url, item.result && item.result.image_url,
                item.result && item.result.images && item.result.images[0] && item.result.images[0].url,
                item.result && item.result.images && item.result.images[0] && item.result.images[0].b64_json,
                item.images && item.images[0] && item.images[0].url,
                item.images && item.images[0] && item.images[0].b64_json,
                data && data.url, data && data.image_url
            ];
            for (let value of values) {
                if (Array.isArray(value)) value = value.find(itemValue => typeof itemValue === 'string' && itemValue.length);
                if (typeof value === 'string' && (/^https?:\/\//i.test(value) || /^data:image\//i.test(value))) return value;
                if (typeof value === 'string' && value.length > 100 && /^[A-Za-z0-9+/=]+$/.test(value)) return 'data:image/png;base64,' + value;
            }
            return '';
        }

        function getGeneratedTaskId(data) {
            const item = Array.isArray(data && data.data) ? data.data[0] : (data && data.data) || data || {};
            return item.task_id || item.id || data.task_id || data.id || '';
        }

        function imageTaskPayload(data) {
            return Array.isArray(data && data.data) ? data.data[0] : (data && data.data) || data || {};
        }

        const imageSleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function rememberImageTask(id) {
            if (!id) return;
            activeImageTaskId = id;
            document.getElementById('imageTaskId').value = id;
            document.getElementById('imageTaskWrap').hidden = false;
            safeStorageSet('cpuck_last_gpt_task_id', id);
        }

        async function pollImageTask(base, key, id, options) {
            const max = (options && options.maxAttempts) || 180;
            const firstDelay = options && options.firstDelay !== undefined ? options.firstDelay : 0;
            for (let index = 0; index < max; index++) {
                await imageSleep(index === 0 ? firstDelay : 4000);
                const data = await imageApiJson(base + '/v1/tasks/' + encodeURIComponent(id), {
                    headers: { 'Authorization': 'Bearer ' + key }
                });
                const item = imageTaskPayload(data);
                const state = String(item.status || data.status || '').toLowerCase();
                const url = getGeneratedImageUrl(data);
                imageStatus('GPT Image 2 任务查询 · ' + (state || '等待状态') + ' · ' + (index + 1) + '/' + max);
                if (['completed', 'success', 'succeeded', 'finished'].includes(state)) {
                    if (url) return url;
                    throw new Error('任务已完成，但接口没有返回可识别的图片地址。任务 ID：' + id);
                }
                if (['error', 'failed', 'cancelled', 'canceled'].includes(state)) {
                    const errorMessage = item.error && (item.error.message || item.error) || data.error && (data.error.message || data.error) || item.message || state;
                    throw new Error('后台任务失败：' + (typeof errorMessage === 'string' ? errorMessage : JSON.stringify(errorMessage)));
                }
            }
            throw new Error('任务仍未返回最终图片。任务 ID：' + id + '。可稍后使用“查询任务”继续获取。');
        }

        async function runGptImage() {
            const key = document.getElementById('imageApiKey').value.trim();
            const prompt = document.getElementById('imagePrompt').value.trim();
            const mode = getImageTaskMode();
            const base = normalizeImageBase(document.getElementById('imageApiBaseUrl').value);
            const model = document.getElementById('imageModelId').value.trim() || 'gpt-image-2-ext';
            if (!key) throw new Error('请填写 APIMart API Key。');
            if (!prompt) throw new Error('请先输入图像提示词或编辑指令。');
            if (mode === 'edit' && !imageSourceBlob) throw new Error('图像编辑模式需要先上传参考图片。');

            const body = {
                model: model,
                prompt: prompt,
                n: 1,
                resolution: document.getElementById('imageResolution').value,
                size: document.getElementById('imageAspect').value,
                official_fallback: true
            };
            if (mode === 'edit') {
                imageStatus('正在处理参考图并准备提交…');
                const referenceData = await imageJpegData(imageSourceBlob);
                if (!referenceData || !referenceData.startsWith('data:image/')) throw new Error('参考图转换失败。');
                body.image_urls = [referenceData];
            }
            if (document.getElementById('rememberImageKey').checked) {
                safeStorageSet('cpuck_image_api_key', key);
                safeStorageSet('cpuck_image_api_base', base);
            }
            const data = await imageApiJson(base + '/v1/images/generations', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let url = getGeneratedImageUrl(data);
            const taskId = getGeneratedTaskId(data);
            if (taskId) rememberImageTask(taskId);
            if (url) {
                showGeneratedImage(url, 'GPT Image 2');
                return;
            }
            if (!taskId) throw new Error('接口没有返回图片链接或任务 ID：' + JSON.stringify(data).slice(0, 350));
            imageStatus('任务已提交，ID：' + taskId + '。正在等待后台生成…');
            url = await pollImageTask(base, key, taskId, { firstDelay: 12000, maxAttempts: 180 });
            showGeneratedImage(url, 'GPT Image 2');
        }

        function findQwenImage(value) {
            const queue = [value];
            const seen = new Set();
            while (queue.length) {
                const item = queue.shift();
                if (!item) continue;
                if (typeof item === 'string') {
                    if (/^https?:\/\//i.test(item) || /^data:image\//i.test(item)) return item;
                    continue;
                }
                if (typeof item !== 'object' || seen.has(item)) continue;
                seen.add(item);
                if (!Array.isArray(item)) {
                    if (typeof item.url === 'string' && /^https?:\/\//i.test(item.url)) return item.url;
                    if (item.image && typeof item.image.url === 'string') return item.image.url;
                    ['data', 'image', 'images', 'value', 'output', 'files', 'gallery'].forEach(key => {
                        if (item[key]) queue.push(item[key]);
                    });
                } else {
                    item.forEach(child => queue.push(child));
                }
            }
            return '';
        }

        function buildQwenInputs(parameters, prompt, modeText, reference, ratio, steps, seed, random) {
            const fallback = [prompt, modeText, reference, ratio, steps, seed, random, []];
            if (!Array.isArray(parameters) || !parameters.length) return fallback;
            return parameters.map(parameter => {
                const name = String(parameter.parameter_name || parameter.label || parameter.name || parameter.component || '').toLowerCase();
                if (/additional|extra|gallery|multiple.references/.test(name)) return [];
                if (/prompt|instruction/.test(name)) return prompt;
                if (/mode|task/.test(name)) return modeText;
                if (/reference|image|photo|upload/.test(name)) return reference;
                if (/aspect|ratio|size/.test(name)) return ratio;
                if (/steps|step/.test(name)) return steps;
                if (/seed/.test(name)) return seed;
                if (/random|new.seed/.test(name)) return random;
                return parameter.parameter_has_default ? parameter.parameter_default : null;
            });
        }

        function imageRatioLabel(value) {
            const labels = {
                '1:1': 'Square · 1:1', '16:9': 'Landscape · 16:9', '9:16': 'Portrait · 9:16',
                '4:3': 'Landscape · 4:3', '3:4': 'Portrait · 3:4', '3:2': 'Landscape · 3:2',
                '2:3': 'Portrait · 2:3', '21:9': 'Ultrawide · 21:9'
            };
            return labels[value] || 'Square · 1:1';
        }

        async function runQwenImage() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            const mode = getImageTaskMode();
            if (!prompt) throw new Error('请先输入图像提示词或编辑指令。');
            const modeText = mode === 'edit' ? 'Edit an image' : mode === 'transparent' ? 'Transparent PNG' : 'Create an image';
            if (modeText === 'Edit an image' && !imageSourceBlob) throw new Error('Qwen 图像编辑模式需要先上传参考图片。');
            const token = document.getElementById('hfToken').value.trim();
            if (token && document.getElementById('rememberHfToken').checked) safeStorageSet('cpuck_image_hf_token', token);

            imageStatus('正在连接 Hugging Face Space…');
            const module = await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');
            const client = await module.Client.connect(IMAGE_SPACE_ID, Object.assign({}, token ? { token: token } : {}, { events: ['status', 'data'] }));
            let info = {};
            try { info = await client.view_api(); } catch (error) {}
            const endpoints = info.named_endpoints || {};
            const endpointKey = Object.keys(endpoints).find(key => /generate/i.test(key)) || '/generate';
            const endpoint = endpointKey.charAt(0) === '/' ? endpointKey : '/' + endpointKey;
            const parameters = endpoints[endpointKey] && endpoints[endpointKey].parameters;
            const reference = modeText === 'Edit an image' ? module.handle_file(imageSourceBlob) : null;
            const steps = Number(document.getElementById('qwenSteps').value) || 40;
            const seed = Math.max(0, Math.min(2147483647, Number(document.getElementById('qwenSeed').value) || 42));
            const random = document.getElementById('randomSeed').checked;
            const inputs = buildQwenInputs(parameters, prompt, modeText, reference, imageRatioLabel(document.getElementById('imageAspect').value), steps, seed, random);

            imageStatus('已连接 Qwen Space，正在提交任务…');
            const job = client.submit(endpoint, inputs);
            let finalData;
            let lastStatus = null;
            let dataEvents = 0;
            for await (const update of job) {
                if (!update) continue;
                if (update.type === 'status') {
                    lastStatus = update;
                    imageStatus('Qwen Image 2.1 · ' + (update.stage || update.status || '排队 / 推理中') + (update.position != null ? ' · 队列 ' + update.position : ''));
                    if (update.stage === 'error' || update.status === 'error' || update.success === false) {
                        throw new Error('Qwen Space 任务失败：' + (update.message || update.code || '未提供错误详情'));
                    }
                } else if (update.type === 'data') {
                    finalData = update.data;
                    dataEvents += 1;
                    imageStatus('Qwen Image 2.1 · 已收到生成结果，正在解析图片…');
                }
            }
            if (finalData === undefined) {
                throw new Error('Gradio 任务结束，但没有收到 data 结果事件。状态：' + JSON.stringify(lastStatus || {}) + '；data 事件数：' + dataEvents + '。请检查 Space 是否正常运行及 API 参数。');
            }
            const url = findQwenImage(finalData);
            if (!url) throw new Error('Space 已返回 data 结果，但未识别到图片文件：' + JSON.stringify(finalData).slice(0, 500));
            showGeneratedImage(url, 'Qwen Image 2.1');
        }

                function showGeneratedImage(url, modelName) {
            imageResultUrl = url;
            document.getElementById('imageResultImage').src = url;
            document.getElementById('imageResultPreview').hidden = false;
            document.getElementById('imageResultCaption').textContent = modelName + ' · ' + new Date().toLocaleString('zh-CN');
            ['insertImageBtn', 'downloadImageBtn', 'useImageBtn'].forEach(id => { document.getElementById(id).disabled = false; });
            imageStatus('生成完成。可以插入 Markdown、下载图片，或将结果作为下一次编辑的参考图。', 'success');
        }

        async function insertGeneratedImageIntoMarkdown() {
            if (!imageResultUrl) return;
            const button = document.getElementById('insertImageBtn');
            button.disabled = true;
            try {
                const response = await fetch(imageResultUrl);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const blob = await response.blob();
                if (!blob.type || !blob.type.startsWith('image/')) throw new Error('返回内容不是图片');
                const dataUrl = await imageBlobDataUrl(blob);
                const saved = insertAtCursor('\n![AI 生成图片](' + dataUrl + ')\n');
                imageStatus(saved === false
                    ? 'AI 图片已插入，但本地缓存空间可能不足；请立即导出 MD 备份。'
                    : 'AI 生成图已完整嵌入 Markdown，可随 MD 一起保存。',
                    saved === false ? 'error' : 'success');
            } catch (error) {
                // 部分图像服务不开放跨域读取：退回插入服务商图片 URL，不让用户丢失结果。
                if (/^(https?:\/\/|data:image\/)/i.test(String(imageResultUrl))) {
                    insertAtCursor('\n![AI 生成图片](' + imageResultUrl + ')\n');
                    imageStatus('图片已按原始链接插入 Markdown；若服务商链接有时效，请同时下载图片备份。', 'success');
                } else {
                    imageStatus('AI 图片插入失败：' + (error.message || error), 'error');
                }
            } finally {
                button.disabled = !imageResultUrl;
            }
        }

        async function downloadGeneratedImage() {
            if (!imageResultUrl) return;
            try {
                const response = await fetch(imageResultUrl);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const blob = await response.blob();
                saveBlobAsFile(blob, 'AI_Image_' + Date.now() + '.png');
            } catch (error) {
                window.open(imageResultUrl, '_blank', 'noopener,noreferrer');
                imageStatus('浏览器不允许跨域直接下载，已在新窗口打开图片；可在图片页面保存。', 'success');
            }
        }

        async function useGeneratedImageAsSource() {
            if (!imageResultUrl) return;
            try {
                const response = await fetch(imageResultUrl);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                setImageSource(await response.blob(), '上一次生成的图片');
                document.getElementById('imageTaskMode').value = 'edit';
                updateImageTaskLabel();
                imageStatus('已将生成结果设为参考图。输入新的编辑指令即可继续修改。', 'success');
            } catch (error) {
                imageStatus('无法读取结果图片（可能受跨域限制）。请先下载结果，再重新上传进行编辑。', 'error');
            }
        }

        async function generateImage() {
            if (imageRunning) return;
            imageRunning = true;
            activeImageTaskId = '';
            document.getElementById('imageTaskWrap').hidden = true;
            document.getElementById('generateImageBtn').disabled = true;
            document.getElementById('generateImageBtn').textContent = '正在生成…';
            imageStatus('正在准备请求…');
            try {
                if (activeImageModel === 'gpt') await runGptImage();
                else await runQwenImage();
            } catch (error) {
                if (activeImageModel === 'gpt' && activeImageTaskId) {
                    document.getElementById('imageTaskWrap').hidden = false;
                    document.getElementById('imageTaskId').value = activeImageTaskId;
                }
                imageStatus(error.message || String(error), 'error');
            } finally {
                imageRunning = false;
                document.getElementById('generateImageBtn').disabled = false;
                updateImageTaskLabel();
            }
        }

        function initImageGenerator() {
            document.getElementById('imageModel').addEventListener('change', updateImageModel);
            document.getElementById('imageTaskMode').addEventListener('change', updateImageTaskLabel);
            document.getElementById('toggleChatKey').addEventListener('click', function () {
                const field = document.getElementById('apiKey');
                field.type = field.type === 'password' ? 'text' : 'password';
                this.textContent = field.type === 'password' ? '显示' : '隐藏';
            });
            document.getElementById('toggleImageApiKey').addEventListener('click', function () {
                const field = document.getElementById('imageApiKey');
                field.type = field.type === 'password' ? 'text' : 'password';
                this.textContent = field.type === 'password' ? '显示' : '隐藏';
            });
            document.getElementById('toggleHfToken').addEventListener('click', function () {
                const field = document.getElementById('hfToken');
                field.type = field.type === 'password' ? 'text' : 'password';
                this.textContent = field.type === 'password' ? '显示' : '隐藏';
            });
            document.getElementById('imagePrompt').addEventListener('input', updateImagePromptCount);
            updateImagePromptCount();
            document.getElementById('generateImageBtn').addEventListener('click', generateImage);
            document.getElementById('insertImageBtn').addEventListener('click', insertGeneratedImageIntoMarkdown);
            document.getElementById('downloadImageBtn').addEventListener('click', downloadGeneratedImage);
            document.getElementById('useImageBtn').addEventListener('click', useGeneratedImageAsSource);
            document.getElementById('removeImageSource').addEventListener('click', clearImageSource);
            document.getElementById('insertSourceImageBtn').addEventListener('click', insertSourceImageIntoMarkdown);
            const imageInput = document.getElementById('imageInput');
            const imageDrop = document.getElementById('imageUploadDrop');
            const acceptImageFile = file => {
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    imageStatus('请选择 PNG、JPG、WebP 等图片文件。', 'error');
                    return;
                }
                setImageSource(file, file.name);
                imageStatus('参考图片已载入。可选择图像编辑，或保持自动判断。');
            };
            imageInput.addEventListener('change', event => acceptImageFile(event.target.files && event.target.files[0]));
            ['dragenter', 'dragover'].forEach(name => imageDrop.addEventListener(name, event => {
                event.preventDefault();
                imageDrop.classList.add('drag');
            }));
            ['dragleave', 'drop'].forEach(name => imageDrop.addEventListener(name, event => {
                event.preventDefault();
                imageDrop.classList.remove('drag');
            }));
            imageDrop.addEventListener('drop', event => {
                const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
                acceptImageFile(file);
            });
            document.getElementById('imagePrompt').addEventListener('input', saveImageSettings);
            document.getElementById('imageApiKey').addEventListener('input', saveImageSettings);
            document.getElementById('hfToken').addEventListener('input', saveImageSettings);
            document.getElementById('rememberImageKey').addEventListener('change', saveImageSettings);
            document.getElementById('rememberHfToken').addEventListener('change', saveImageSettings);
            document.getElementById('queryImageTaskBtn').addEventListener('click', async function () {
                if (imageRunning) return;
                const key = document.getElementById('imageApiKey').value.trim();
                const id = document.getElementById('imageTaskId').value.trim();
                if (!key) { imageStatus('请先填写 APIMart API Key。', 'error'); return; }
                if (!id) { imageStatus('请填写需要查询的 task ID。', 'error'); return; }
                imageRunning = true;
                this.disabled = true;
                this.textContent = '查询中…';
                try {
                    const url = await pollImageTask(normalizeImageBase(document.getElementById('imageApiBaseUrl').value), key, id, { firstDelay: 0, maxAttempts: 180 });
                    showGeneratedImage(url, 'GPT Image 2');
                } catch (error) {
                    imageStatus(error.message || String(error), 'error');
                } finally {
                    imageRunning = false;
                    this.disabled = false;
                    this.textContent = '查询';
                }
            });
            updateImageModel();
            updateImageTaskLabel();
        }
