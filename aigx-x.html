function jsonResult(obj,status=200){return new Response(JSON.stringify(obj),{status,headers:{'content-type':'application/json;charset=utf-8'}});}
function cleanOpts(options={}){return {method:options.method||'GET',body:options.body,signal:options.signal,cache:options.cache||'no-store',credentials:'omit'};}
async function checkedFetch(url,options){try{return await nativeFetch(url,options);}catch(err){throw Error('直连接口失败：'+String(err?.message||err)+'。可能是浏览器 CORS 跨域限制、DNS 或目标服务不可访问。请给 API 提供允许跨域的 HTTPS 代理，或检查 Key。');}}
window.fetch = async function(input,options={}) {
  const path=typeof input==='string'?input:(input?.url||'');
  if(typeof path!=='string'||!path.startsWith('?api='))return nativeFetch(input,options);
  const params=new URLSearchParams(path.slice(1)), route=params.get('api');
  const opts=cleanOpts(options);
  if(route==='share_limits')return jsonResult({max_bytes:15*1024*1024,post_max_size:'browser',upload_max_filesize:'browser',file_uploads:true});
  if(route==='qr_image'){
    const url=params.get('url');if(!url||!/^https?:\/\//i.test(url))return jsonResult({error:{message:'图片 URL 不合法'}},400);
    return checkedFetch(url,{...opts,mode:'cors'});
  }
  if(route==='share_image'){
    const id=getImgurId();if(!id)return jsonResult({error:{message:'请先填写 Imgur Client ID。纯 HTML 没有服务端隐藏的上传凭据。'}},400);
    const upstream=await checkedFetch('https://api.imgur.com/3/image',{...opts,method:'POST',headers:{Authorization:'Client-ID '+id},body:options.body});
    const reply=await upstream.json().catch(()=>({}));
    if(!upstream.ok||!reply.success||!reply.data?.link)return jsonResult({error:{message:reply?.data?.error?.message||reply?.data?.error||reply?.error||'Imgur 拒绝上传'}},upstream.status||502);
    return jsonResult({url:reply.data.link});
  }
  if(route==='chat'||route==='deepseek'){
    const key=route==='deepseek'?getDeepseekKey():getTextKey();
    if(!key)return jsonResult({error:{message:'请填写 '+(route==='deepseek'?'DeepSeek':'Poixe')+' API Key'}},401);
    const target=providerBase()+'chat/completions';
    return checkedFetch(target,{...opts,method:'POST',headers:authHeaders(key,{'Content-Type':'application/json'}),body:options.body});
  }
  if(route==='gpt_image_create'||route==='gpt_image_query'){
    const key=getImageKey();if(!key)return jsonResult({error:{message:'请填写 APIMart API Key'}},401);
    const target=route==='gpt_image_create'?'https://api.apimart.ai/v1/images/generations':'https://api.apimart.ai/v1/tasks/'+encodeURIComponent(params.get('task_id')||'');
    return checkedFetch(target,{...opts,headers:authHeaders(key,route==='gpt_image_create'?{'Content-Type':'application/json'}:{}),method:route==='gpt_image_create'?'POST':'GET'});
  }
  if(route==='image'){
    const key=getTextKey();if(!key)return jsonResult({error:{message:'请填写 Poixe Gemini API Key'}},401);
    const model=params.get('model')||'gemini-2.5-flash-image';
    if(!/^[a-zA-Z0-9_.-]+$/.test(model))return jsonResult({error:{message:'模型名称无效'}},400);
    const base=providerBase().replace(/v1\/?$/,'');
    return checkedFetch(base+'v1beta/models/'+encodeURIComponent(model)+':generateContent',{...opts,method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key}});
  }
  if(route==='qwen_asr'){
    const op=params.get('op');const id=params.get('id');const token=options.headers?.['X-ASR-Token']||$('audioAsrToken')?.value.trim()||$('directHfKey')?.value.trim()||'';
    if(token&&!/^hf_[A-Za-z0-9_-]+$/.test(token))return jsonResult({error:{message:'Hugging Face Token 格式错误'}},400);
    const headers=token?{'Authorization':'Bearer '+token}:{};
    const root='https://qwen-qwen3-asr-demo.hf.space/gradio_api';
    if(op==='upload'){
      const f=new FormData();f.append('files',new Blob([options.body],{type:'audio/wav'}),'tcq233_chunk.wav');
      return checkedFetch(root+'/upload',{...opts,method:'POST',headers,body:f});
    }
    if(op==='call')return checkedFetch(root+'/call/asr_inference',{...opts,method:'POST',headers:{...headers,'Content-Type':'application/json'},body:options.body});
    if(op==='result'&&/^[A-Za-z0-9_-]{1,128}$/.test(id||''))return checkedFetch(root+'/call/asr_inference/'+id,{...opts,method:'GET',headers});
    return jsonResult({error:{message:'不支持的 Qwen ASR 请求'}},400);
  }
  return jsonResult({error:{message:'浏览器模式不支持的 API：'+route}},404);
};

function toggleSelect(event) {
    event.stopPropagation();
    customSelect.classList.toggle('open');

function selectEngine(url, label, option) {
    document.getElementById('searchEngineValue').value = url;
    document.getElementById('currentEngineText').textContent = label;

    customSelect.classList.remove('open');
    searchInput.focus();
}

    searchInput.value = '';

function checkKeyRequirement(model, isForcedGpt = false) {
    if (model === 'gpt-image-2') {
        getImageApiKey(); 
        if (!getImageApiKey()) { alert('请先在工具箱 API 配置中填写 APIMart Key'); return false; }
        return true; 
    } else {
        const key = getApiKey();
        
        if (!key) {
            alert("请先在工具箱的对应 API 配置中填写 Poixe API Key");

function copyToClipboard(text, btnElement) {
    function copySuccess() {
        if(!btnElement) return;
        const old = btnElement.innerHTML;
        const oldBg = btnElement.style.background;
        const oldColor = btnElement.style.color;
        btnElement.innerHTML = "✓ 复制成功";
        btnElement.style.background = "rgba(0, 255, 65, 0.2)"; 
        btnElement.style.color = "#00ff41";
        setTimeout(() => {
            btnElement.innerHTML = old;
            btnElement.style.background = oldBg;
            btnElement.style.color = oldColor;
        }, 2000);
    }
    function copyFallback() {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try { document.execCommand('copy'); copySuccess(); } catch (err) {}
        textArea.remove();
    }
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(copySuccess).catch(copyFallback);
    } else { copyFallback(); }
}

async function getOptimizedBase64(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const max = 1536; 
            if (w > max || h > max) {
                if (w > h) { h = Math.round((h * max) / w); w = max; } 
                else { w = Math.round((w * max) / h); h = max; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            const base64 = dataUrl.split(',')[1];
            resolve({ mimeType: 'image/jpeg', base64Data: base64, fullUrl: dataUrl });
        };
        img.onerror = () => reject(new Error("图片加载失败"));
        img.crossOrigin = "Anonymous";
        img.src = src;
    });
}

async function pollGptTask(taskId) {
    respStatus.textContent = 'TASK QUEUED...';
    response.textContent = 'TASK_ID: ' + String(taskId).slice(0,16) + '\n正在查询生成进度...';
    await sleep(5000);
    let lastData=null;
    for(let attempt=1;attempt<=45;attempt++) {
        const imageApiKey=getImageApiKey();
        const apiProxy=getApiProxy();
        const data=await fetchApiJson('?api=gpt_image_query&task_id='+encodeURIComponent(taskId),{
            headers:{'X-Image-Key':imageApiKey,'X-Proxy-Url':apiProxy}
        });
        lastData=data;
        const task=Array.isArray(data?.data)?data.data[0]:(data?.data||data);
        const state=String(task?.status||data?.status||'').toLowerCase();
        const url=extractImageResultUrl(data);
        if(['completed','succeeded','success','finished'].includes(state) || (!state&&url)) {
            if(!url) throw new Error('任务完成但没有返回图像链接：'+JSON.stringify(data).slice(0,500));
            return {finalImageUrl:url,queryData:data};
        }
        if(['failed','error','cancelled','canceled'].includes(state)) {
            const reason=task?.error?.message||task?.error||data?.error?.message||'云端图像任务失败';
            throw new Error(typeof reason==='string'?reason:JSON.stringify(reason));
        }
        respStatus.textContent='RENDER: '+(state||'QUEUED')+' ['+attempt+'/45]';
        await sleep(4000);
    }
    throw new Error('任务查询超时，请保留任务号：'+taskId+'。最后状态：'+JSON.stringify(lastData).slice(0,500));
}

                    const requestParts = [];
                    if (isImageMode) requestParts.push({ inlineData: { mimeType: mimeType, data: base64Data } });
                    if (content) requestParts.push({ text: content });

                    const requestBody = { contents: [{ parts: requestParts }], generationConfig: { responseModalities: ["Text", "Image"] } };
                    const createRes = await fetch("?api=image&model=" + model, {
                        method: 'POST',
                        headers: { 'X-User-Key': apiKey, 'X-Proxy-Url': apiProxy, 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    if (!createRes.ok) {
                        const err = await createRes.json().catch(()=>({}));
                        throw new Error(err.error?.message || "HTTP " + createRes.status);
                    }

                    const data = await createRes.json();
                    let imageUrl = "";

                    });
                    if (!imageUrl) throw new Error("SYS_ERR: API未返回图片数据");

                    const duration = ((Date.now() - startTime) / 1000).toFixed(2);
                    setupGeneratedImage(imageUrl, "RENDER_COMPLETE", isImageMode);
                    
                    if(isImageMode) requestBody.contents[0].parts[0].inlineData.data = "[Base64 Data Truncated]";
                    response.textContent = "| ⏱️ " + duration + "s |\n📦 Payload:\n" + JSON.stringify(requestBody) + "\n-- SYS_SUCCESS";
                }
            } catch (e) {
                respStatus.textContent = "❌ ERROR"; respStatus.style.color = "#ff2a2a";
                response.textContent = "SYS_ERR: " + e.message;
            }
            btnCombinedAction.innerHTML = oldText; btnCombinedAction.disabled = false;
        }

function extractImageResultUrl(payload) {
    const d = Array.isArray(payload?.data) ? payload.data[0] : (payload?.data || payload);
    const candidates = [d?.url, d?.image_url, d?.result?.url,
        d?.result?.image_url, d?.result?.images?.[0]?.url, d?.images?.[0]?.url,
        d?.result?.image_urls?.[0]];
    for (const item of candidates) {
        const url = Array.isArray(item) ? item[0] : item;
        if (typeof url === 'string' && /^(https?:\/\/|data:image\/)/i.test(url)) return url;
    }
    return '';
}

async function fetchApiJson(url, options = {}) {
    let res;
    try { res = await fetch(url, options); }
    catch (e) { throw new Error('无法连接 API：' + e.message + '\n如请求本地 HTTP 模型，请检查 CORS / HTTPS 混合内容 / 浏览器局域网访问限制。'); }
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch (e) { throw new Error('API 返回非 JSON (HTTP ' + res.status + ')：' + raw.slice(0,350)); }
    if (!res.ok) {
        let msg = data?.error?.message || data?.error || data?.message || ('HTTP ' + res.status);
        if (typeof msg !== 'string') msg = JSON.stringify(msg);
        throw new Error('HTTP ' + res.status + '：' + msg);
    }
    return data;
}

function saveExtraSetting(id, key) {
    const el = document.getElementById(id);
    const v = el?.value.trim() || '';
    try { if (v) localStorage.setItem(key,v); else localStorage.removeItem(key); } catch (e) {}
    return v;
}
function getCustomEndpoint() {
    let base = saveExtraSetting('customApiUrl','suishouji_custom_url').replace(/\/+$/,'');
    if (!base) throw new Error('SYS_PROMPT: 请填写自定义 API 地址，例如 http://192.168.31.111:5001/v1/');
    if (!/^https?:\/\//i.test(base)) throw new Error('API 地址必须以 http:// 或 https:// 开头');
    if (base.endsWith('/chat/completions')) return base;
    if (!/\/v1$/i.test(base) && !/\/v\d+(?:\.\d+)?$/i.test(base)) base += '/v1';
    return base + '/chat/completions';
}
function getModelReply(data) {
    const content = data?.choices?.[0]?.message?.content;
    if (typeof content === 'string' && content.trim()) return content;
    if (Array.isArray(content)) return content.map(x => x?.text || '').join('\n');
    throw new Error('接口未返回 choices[0].message.content：' + JSON.stringify(data).slice(0,500));
}
function getSafeHistory() {
    // 留出合理上下文窗口并避免含 base64 的记录被导出无限膨胀。
    return chatContext.slice(-40);
}
async function addImagePartForModel(message) {
    const src = modifiedImgSrc || originalImgSrc;
    if (!src || imageDisplayContainer.style.display === 'none') return message;
    let url = src;
    let temp = null;
    try {
        if (/^https?:\/\//i.test(src)) {
            const blob = await fetchImageBlobForShare(src);
            temp = URL.createObjectURL(blob);
            url = temp;
        }

}
async function getHfSpace() {
    const key = saveExtraSetting('hfApiKey','suishouji_hf_api_key');
    if (hfAppPromise && hfAppCacheKey === key) return hfAppPromise;
    hfAppCacheKey = key;
    const lib = await getHfLib();
    const options = key ? {hf_token:key, token:key} : {};
    hfAppPromise = lib.Client.connect(HF_SPACE_URL, options).catch(async () => lib.Client.connect(HF_SPACE_ID, options));
    try { return await hfAppPromise; }
    catch(e) { hfAppPromise=null; throw new Error('HF Space 连接失败：' + e.message); }
}
function hfResultImage(obj) {
    if (!obj) return '';
    if (typeof obj === 'string') return obj;
    if (Array.isArray(obj)) { for (const o of obj) {const result = hfResultImage(o); if(result) return result;} return ''; }
    if (typeof obj === 'object') return obj.url || obj.path || obj.download_url || '';
    return '';
}
async function runHfImage() {
    const prompt = universalText.value.trim();
    if (!prompt) return alert('SYS_PROMPT: 请输入 HF 生图或改图提示词');
    const btn=btnCombinedAction; btn.disabled=true;
    responseWrap.style.display='block';
    respStatus.textContent='HF CONNECTING...'; respStatus.style.color='#00f0ff';
    response.textContent='⏳ Loading Hugging Face Gradio client...';
    try {
        const {handle_file} = await getHfLib();
        const app=await getHfSpace();
        const source=modifiedImgSrc||originalImgSrc;
        const hasImage=!!source && imageDisplayContainer.style.display!=='none';
        const modeSetting=document.getElementById('hfGenerationMode').value;
        const mode=modeSetting==='auto' ? (hasImage ? 'Edit an image' : 'Create an image') : modeSetting;
        if(mode==='Edit an image' && !hasImage) throw new Error('HF 改图模式需要先选择或生成参考图片');
        let reference=null;
        if(mode==='Edit an image') {
            const file=universalFile.files?.[0];
            const selectedLocal=file && file.type.startsWith('image/') && source.startsWith('blob:') && !modifiedImgSrc;
            const imageFile=selectedLocal ? file : await fetchImageBlobForShare(source);
            reference=handle_file(imageFile);
        }
        const aspect=HF_ASPECT_MAP[document.getElementById('imgSize').value] || 'Square · 1:1';
        const args=[prompt,mode,reference,aspect,40,42,true];
        response.textContent='HF SPACE: '+HF_SPACE_ID+'\nMODE: '+mode+'\nASPECT: '+aspect+'\n⏳ QUEUING...\n';
        const request=app.submit(HF_IMAGE_API_NAME,args);
        let finalData=null;
        for await(const progress of request) {
            if(progress.type==='status') {
                const queue=Number.isFinite(progress.queue_position) ? ' / QUEUE '+progress.queue_position : '';
                respStatus.textContent='HF: '+(progress.stage||'WORKING')+queue;
            }
            if(progress.type==='data') finalData=progress.data;
        }
        const resolved=finalData || await request.result();
        const outputs=Array.isArray(resolved?.data) ? resolved.data : (Array.isArray(resolved) ? resolved : []);
        const finalUrl=hfResultImage(outputs[0]) || hfResultImage(outputs[1]);
        if(!finalUrl) throw new Error('HF 没有返回有效的图片链接：'+JSON.stringify(resolved).slice(0,700));
        setupGeneratedImage(finalUrl, 'HF_'+(mode==='Edit an image'?'EDIT':'CREATE')+'_COMPLETE',mode==='Edit an image' && hasImage);
        const details=typeof outputs[3]==='string' ? outputs[3] : '';
        response.textContent='✅ HF 完成\nMODE: '+mode+'\nSEED: '+(outputs[2]??'?')+'\n'+details+'\nIMAGE: '+finalUrl;
    } catch(e) {
        respStatus.textContent='❌ HF ERROR'; respStatus.style.color='#ff2a2a';
        response.textContent='SYS_ERR: '+e.message+'\n\nSpace: '+HF_SPACE_URL;
    } finally {btn.disabled=false; onModelChange();}
}

async function showImageMetadata(file) {

async function extractAudioToMP3(file, progressCallback) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(e.target.result);
                
                const channels = audioBuffer.numberOfChannels;
                const sampleRate = audioBuffer.sampleRate;
                const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128); 
                const mp3Data = [];
                
                const left = audioBuffer.getChannelData(0);
                const right = channels > 1 ? audioBuffer.getChannelData(1) : left;
                
                const left16 = new Int16Array(left.length);
                const right16 = channels > 1 ? new Int16Array(right.length) : null;
                
                for (let i = 0; i < left.length; i++) {
                    left16[i] = left[i] < 0 ? left[i] * 0x8000 : left[i] * 0x7FFF;
                    if (channels > 1) {
                        right16[i] = right[i] < 0 ? right[i] * 0x8000 : right[i] * 0x7FFF;
                    }
                }
                
                const sampleBlockSize = 1152;
                let i = 0;
                
                function encodeNextChunk() {
                    const endTime = performance.now() + 25; 
                    while (i < left16.length && performance.now() < endTime) {
                        const leftChunk = left16.subarray(i, i + sampleBlockSize);
                        let mp3buf;
                        if (channels > 1) {
                            const rightChunk = right16.subarray(i, i + sampleBlockSize);
                            mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                        } else {
                            mp3buf = mp3encoder.encodeBuffer(leftChunk);
                        }
                        if (mp3buf.length > 0) mp3Data.push(mp3buf);
                        i += sampleBlockSize;
                    }
                    
                    if (i < left16.length) {
                        if (progressCallback) progressCallback(Math.floor((i / left16.length) * 100));
                        setTimeout(encodeNextChunk, 0); 
                    } else {
                        const mp3buf = mp3encoder.flush();
                        if (mp3buf.length > 0) mp3Data.push(mp3buf);
                        const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                        resolve(URL.createObjectURL(blob));
                    }
                }
                
                encodeNextChunk();
            } catch (err) {
                reject(err);
            }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}

// 图像分享：只有用户点击时才读取/转换/上传；不在页面加载时访问 Imgur。
async function fetchImageBlobForShare(src) {
    if (!src) throw new Error('请先选择、抽取或生成图像');
    let url = src;
    // 第三方 AI 生成 URL 可能不支持浏览器 CORS；此时使用现有的安全图片读取中转。
    const isRemote = /^https?:\/\//i.test(src);
    try {
        const res = await fetch(url, { credentials: 'omit', cache: 'no-store' });
        if (!res.ok) throw new Error('源图 HTTP ' + res.status);
        const blob = await res.blob();
        if (!blob.size) throw new Error('图像内容为空');
        return blob;
    } catch (firstError) {
        if (!isRemote) throw new Error('无法读取当前图片：' + firstError.message);
        const proxyRes = await fetch('?api=qr_image&url=' + encodeURIComponent(src), { cache: 'no-store' });
        if (!proxyRes.ok) {
            const raw = await proxyRes.text();
            let reason = raw.slice(0, 200);
            try { reason = JSON.parse(raw).error?.message || reason; } catch (_) {}
            throw new Error('远程图片读取失败：' + reason);
        }
        const blob = await proxyRes.blob();
        if (!blob.size) throw new Error('远程图片为空');
        return blob;
    }
}

async function getShareLimitBytes() {
    // 可自动适配常见的 PHP 2M/8M 限制，避免 $_FILES 为空。
    try {
        const res = await fetch('?api=share_limits', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const config = await res.json();
        if (config.file_uploads === false) throw new Error('服务器禁用了 PHP 文件上传');
        const n = Number(config.max_bytes);
        if (Number.isFinite(n) && n > 64 * 1024) return n;
        throw new Error('服务器上传额度太小');
    } catch (e) {
        // 如果限额查询失败，使用安全的小文件目标；真实失败仍由后端返回明确原因。
        if (e.message.includes('禁用了') || e.message.includes('太小')) throw e;
        return 1500 * 1024;
    }
}

async function toShareJpegWithinLimit(blob, maxBytes) {
    const objectUrl = URL.createObjectURL(blob);
    let img;
    try {
        img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = () => reject(new Error('无法解码该图片，请转换为 JPG/PNG 再试'));
            el.src = objectUrl;
        });
        const originalWidth = img.naturalWidth || img.width;
        const originalHeight = img.naturalHeight || img.height;
        if (!originalWidth || !originalHeight) throw new Error('图片尺寸不正确');
        // 图片过大时优先限制最长边，再逐步降低质量和尺寸以适应服务器限制。
        for (const maxSide of [4096, 3072, 2560, 2048, 1600, 1280, 960]) {
            const ratio = Math.min(1, maxSide / Math.max(originalWidth, originalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(originalWidth * ratio));
            canvas.height = Math.max(1, Math.round(originalHeight * ratio));
            const ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('浏览器无法创建画布');
            ctx.fillStyle = '#ffffff'; // JPEG 不支持透明，使用白底
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            for (const quality of [0.92, 0.85, 0.77, 0.67, 0.55]) {
                const result = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
                if (result && result.size && result.size <= maxBytes) return result;
            }
        }
        throw new Error('图像压缩后仍超过上传限制，请先缩小图像分辨率');
    } finally {
        URL.revokeObjectURL(objectUrl);
    }
}

async function prepareShareImage(blob, maxBytes) {
    if (!blob || blob.size < 1) throw new Error('未读取到有效图片');
    if (['image/jpeg', 'image/png'].includes(blob.type) && blob.size <= maxBytes) {
        return { blob, converted: false };
    }
    const converted = await toShareJpegWithinLimit(blob, maxBytes);
    return { blob: converted, converted: true };
}

            fileName = selectedFile.name || fileName;
        } else {

        }

        const maxBytes = await getShareLimitBytes();
        btn.textContent = '⏳ 检查图像大小...';
        const prepared = await prepareShareImage(rawBlob, maxBytes);
        const imageBlob = prepared.blob;
        if (prepared.converted) {
            fileName = 'shared-image.jpg';
        } else if (!fileName.match(/\.(jpe?g|png)$/i)) {
            fileName = 'shared-image.' + (imageBlob.type === 'image/png' ? 'png' : 'jpg');

        respStatus.textContent = '正在上传 Imgur...';
        const formData = new FormData();
        formData.append('image', imageBlob, fileName);
        const uploadResponse = await fetch('?api=share_image', {
            method: 'POST',
            body: formData,
            cache: 'no-store'
            // 不要手动设置 Content-Type，否则 multipart boundary 会丢失。
        });
        const rawReply = await uploadResponse.text();
        let payload;
        try { payload = JSON.parse(rawReply); } catch (e) {
            if (uploadResponse.status === 413) {
                throw new Error('HTTP 413：Nginx/反向代理拒绝大文件，请增大 client_max_body_size');
            }
            throw new Error('服务器未返回 JSON（HTTP ' + uploadResponse.status + '）：' + rawReply.slice(0, 160));
        }
        if (!uploadResponse.ok || !payload.url) {
            throw new Error(payload.error?.message || payload.error || ('图像分享失败（HTTP ' + uploadResponse.status + '）'));
        }

        universalText.value = payload.url;
        universalText.dispatchEvent(new Event('input'));
        respStatus.textContent = '✅ 图像分享成功';
        respStatus.style.color = '#00ff41';
        response.textContent = 'IMGUR_UPLOAD_OK\n' +
            '上传大小：' + (imageBlob.size / 1024 / 1024).toFixed(2) + ' MB' +
            (prepared.converted ? '（自动转换 / 压缩）' : '（原图）') + '\n' + payload.url;
        btn.textContent = '✅ 链接已写入 TXT';
        setTimeout(() => { if (!btn.disabled) btn.textContent = oldText; }, 2000);
    } catch (error) {
        respStatus.textContent = '❌ 图像分享失败';
        respStatus.style.color = '#ff2a2a';
        response.textContent = 'SYS_ERR: ' + error.message;
        alert('SYS_ERR: ' + error.message);
    } finally {
        btn.disabled = false;
        if (btn.textContent !== '✅ 链接已写入 TXT') btn.textContent = oldText;
    }
});

async function doPing() {
    if(!pingTextElem) return;
    const img = new Image();
    const start = performance.now();
    let isFinished = false; 

    img.onload = function() {
        if (isFinished) return;
        isFinished = true;
        const end = performance.now();
        const ms = Math.floor(end - start);
        pingTextElem.innerText = ms + " ms";
        
        if (ms < 50) pingTextElem.style.color = "#00ff41";
        else if (ms < 100) pingTextElem.style.color = "#d9a23a";
        else pingTextElem.style.color = "#ff2a2a";

        addData(ms);
    };

    img.onerror = function() {
        if (isFinished) return;
        isFinished = true;
        pingTextElem.innerText = "UPLINK_DOWN";
        pingTextElem.style.color = "#ff2a2a"; 
        addData(500); 
    };

    setTimeout(() => {
        if (!isFinished) {
            isFinished = true;
            img.src = ""; 
            pingTextElem.innerText = "TIMEOUT";
            pingTextElem.style.color = "#ff2a2a";
            addData(500); 
        }
    }, 2000);

    img.src = currentUrl + "/favicon.ico?t=" + Date.now();
}

function addData(ms) {
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                    now.getMinutes().toString().padStart(2, '0') + ':' + 
                    now.getSeconds().toString().padStart(2, '0');

function drawChart() {
    const canvas = document.getElementById("chart");
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    
    const rect = canvas.parentNode.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);
    
    const w = rect.width;
    const h = rect.height;

    ctx.clearRect(0, 0, w, h);

    const paddingLeft = 30;
    const paddingBottom = 20;
    const chartW = w - paddingLeft - 10; 
    const chartH = h - paddingBottom;

    const maxMs = pingData.length > 0 ? Math.max(...pingData.map(d => d.ms), 60) : 60; 
    
    ctx.strokeStyle = "#333"; 
    ctx.lineWidth = 1;
    ctx.fillStyle = "#666";   
    ctx.font = "10px 'Share Tech Mono', ui-monospace, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    const ySteps = 4; 
    for(let i=0; i<=ySteps; i++){
        let val = Math.round((maxMs / ySteps) * i);
        let y = chartH - (i * (chartH / ySteps));
        y = Math.max(y, 10);

        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(w, y);
        ctx.stroke();

        ctx.fillText(val, paddingLeft - 6, y);
    }

    if(pingData.length < 2) return;

    let points = [];
    pingData.forEach((d, i) => {
        let x = paddingLeft + i * (chartW / (pingData.length - 1));
        let y = chartH - (d.ms / maxMs) * (chartH - 10); 
        points.push({x: x, y: Math.max(10, Math.min(y, chartH))});
    });

    let linePath = new Path2D();
    linePath.moveTo(points[0].x, points[0].y);
    
    for (let i = 0; i < points.length - 1; i++) {
        let xMid = (points[i].x + points[i + 1].x) / 2;
        linePath.bezierCurveTo(xMid, points[i].y, xMid, points[i + 1].y, points[i + 1].x, points[i + 1].y);
    }

    let fillPath = new Path2D(linePath);
    fillPath.lineTo(points[points.length - 1].x, chartH); 
    fillPath.lineTo(points[0].x, chartH);                  
    fillPath.closePath();                                  

    const fillGradient = ctx.createLinearGradient(0, 0, 0, chartH);
    fillGradient.addColorStop(0, "rgba(0, 255, 65, 0.15)"); 
    fillGradient.addColorStop(1, "rgba(0, 255, 65, 0.0)");   

    ctx.fillStyle = fillGradient;
    ctx.fill(fillPath);

    const lineGradient = ctx.createLinearGradient(paddingLeft, 0, w, 0);
    lineGradient.addColorStop(0, "#00ff41");   
    lineGradient.addColorStop(0.5, "#00f0ff"); 
    lineGradient.addColorStop(1, "#00ff41");   

    ctx.strokeStyle = lineGradient;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(linePath);

    ctx.fillStyle = "#666";
    ctx.textBaseline = "top";
    
    ctx.textAlign = "left";
    ctx.fillText(pingData[0].time, paddingLeft, chartH + 5); 
    
    ctx.textAlign = "right";
    ctx.fillText(pingData[pingData.length - 1].time, points[points.length - 1].x, chartH + 5); 
}

      notify('⌛ 正在读取音频…');
      const decoded=await decodeFile(file);
      audioLab.originalFile=file;
      install(decoded.buffer,file.name,decoded.blob);
      return true;
    } finally { setBusy(false); }
  }
  $('audioLabChoose').addEventListener('click',()=>{$('audioLabFile').click();});
  $('audioLabFile').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{await beginLoad(file);}catch(error){notify('❌ '+error.message);}finally{e.target.value='';}
  });
  async function fromCurrentFile(open = true) {
    if(open)openPanel();
    if(audioLab.buffer)return true;
    const file=universalFile.files?.[0];
    if(!file || (!isAudio(file) && !isVideo(file)))return false;
    await beginLoad(file);
    return !!audioLab.buffer;
  }
  $('btnAudioEdit').addEventListener('click',async()=>{
    try {
      if(!(await fromCurrentFile())) {notify('请在页面底部选择音频/视频，或点击“导入音视频”。');$('audioLabFile').click();}
    }catch(e){notify('❌ '+e.message);}
  });
  $('audioLabKeep').addEventListener('click',()=>{
    try {
      const p=params(),b=audioLab.buffer,from=Math.floor(p.start*b.sampleRate),to=Math.min(b.length,Math.ceil(p.end*b.sampleRate));
      const trimmed=ac().createBuffer(b.numberOfChannels,to-from,b.sampleRate);
      for(let c=0;c<b.numberOfChannels;c++)trimmed.copyToChannel(b.getChannelData(c).slice(from,to),c);
      audioLab.history.push({buffer:b,name:audioLab.name,blob:audioLab.originalBlob});
      if(audioLab.history.length>10)audioLab.history.shift();
      const wav=new Blob([pcmWav(Array.from({length:trimmed.numberOfChannels},(_,c)=>trimmed.getChannelData(c)),trimmed.sampleRate)],{type:'audio/wav'});
      install(trimmed, audioLab.name.replace(/\.[^.]+$/,'')+'_clip.wav',wav,false);
      notify('✂ 已保留选段，原素材保留在撤销历史中；旧 ASR 时间轴已清空。');
    }catch(e){notify('❌ '+e.message);}
  });
  $('audioLabUndo').addEventListener('click',()=>{
    const last=audioLab.history.pop();if(!last)return;
    install(last.buffer,last.name,last.blob,false);
    notify('↶ 已撤销上一次裁剪');
  });
  async function exportOptions(blob,format) {
    if(format==='wav')return blob;
    const maps={mp3:['-c:a','libmp3lame','-b:a','192k'],flac:['-c:a','flac'],m4a:['-c:a','aac','-b:a','192k','-movflags','+faststart'],aac:['-c:a','aac','-b:a','192k','-f','adts'],ogg:['-c:a','libvorbis','-b:a','192k'],opus:['-c:a','libopus','-b:a','192k','-ar','48000'],webm:['-c:a','libopus','-b:a','192k','-ar','48000']};
    if(format==='mp3'){
      // 已加载的 lamejs 优先，避免 MP3 导出必须拉取约 32MB 的 FFmpeg。
      try{
        const decoded=await ac().decodeAudioData(await blob.arrayBuffer());
        return await encodeMP3(Array.from({length:decoded.numberOfChannels},(_,i)=>decoded.getChannelData(i)),decoded.sampleRate);
      }catch(e){notify('浏览器 MP3 编码失败，切换 FFmpeg…');}
    }
    if(!maps[format])throw Error('不支持的目标音频格式');
    return await ffTranscode(blob,'tcq_audio.wav',format,['-vn',...maps[format]]);
  }
  async function makeProcessedWav() {
    const p=params($('audioLabScope').value),channels=processedChannels(p);
    return new Blob([pcmWav(channels,audioLab.buffer.sampleRate)],{type:'audio/wav'});
  }
  $('audioLabPreview').addEventListener('click',async()=>{
    if(audioLab.busy)return;
    try {
      setBusy(true); const wav=await makeProcessedWav();cleanPlayer();audioLab.playerUrl=URL.createObjectURL(wav);
      $('audioLabPlayer').src=audioLab.playerUrl;
      await $('audioLabPlayer').play();notify('▶ 正在试听当前设置处理后的音频。');
    }catch(e){notify('❌ '+e.message);}finally{setBusy(false);}
  });
  $('audioLabExport').addEventListener('click',async()=>{
    if(audioLab.busy)return;
    try {
      setBusy(true);notify('⌛ 正在本地生成音频…');
      const format=$('audioLabFormat').value;
      const blob=await exportOptions(await makeProcessedWav(),format);
      download(blob,`${safeStem(audioLab.name)}_edited.${format}`);
      notify(`✅ ${format.toUpperCase()} 导出完成，文件大小 ${(blob.size/1048576).toFixed(2)} MB。`);
    }catch(e){notify('❌ 导出失败：'+e.message);}finally{setBusy(false);}
  });

  // 单独提取音轨，避免原“视频分离”必须先抽取所有画面。
  $('btnExtractAudio').addEventListener('click',async()=>{
    const file=universalFile.files?.[0] || audioLab.originalFile;
    if(!isVideo(file)){ alert('请先通过页面底部的文件选择框载入视频（MP4/MOV/WebM 等）');return; }
    if(audioLab.busy)return;
    openPanel();setBusy(true);
    try{
      notify('🎞️ 正在仅提取视频音轨，无须抽取画面…');
      let mp3;
      try {
        mp3=await ffTranscode(file,file.name,'mp3',['-map','0:a:0','-vn','-c:a','libmp3lame','-b:a','192k']);
      }catch(e){
        notify('FFmpeg 提取失败，尝试浏览器解码回退…');
        try {
          const b=await ac().decodeAudioData(await file.arrayBuffer());
          mp3=await encodeMP3(Array.from({length:b.numberOfChannels},(_,i)=>b.getChannelData(i)),b.sampleRate);
        }catch(nativeError){throw Error('视频无可解码的音轨，或 FFmpeg CDN/WASM 无法加载：'+e.message);}
      }
      if(mp3.size<200)throw Error('提取结果为空');
      const decoded=await ac().decodeAudioData(await mp3.arrayBuffer());
      audioLab.originalFile=file;
      install(decoded,`${safeStem(file.name)}_audio.mp3`,mp3);
      download(mp3,`${safeStem(file.name)}_audio.mp3`);
      notify(`✅ 成功提取音频：${(mp3.size/1048576).toFixed(2)} MB，已下载 MP3 并载入剪辑工作台。`);
    }catch(e){notify('❌ 视频提取音频失败：'+e.message);}finally{setBusy(false);}
  });

  function chunkWav(buffer,start,end) {
    const rate=16000, length=Math.max(1,Math.round((end-start)*rate));
    const pcm=new Float32Array(length),channels=buffer.numberOfChannels,sr=buffer.sampleRate;
    const arrays=Array.from({length:channels},(_,ch)=>buffer.getChannelData(ch));
    for(let i=0;i<length;i++){
      const at=(start+i/rate)*sr,j=Math.min(buffer.length-1,Math.floor(at)),k=Math.min(buffer.length-1,j+1),blend=at-j;
      let mix=0;
      for(const data of arrays)mix+=data[j]*(1-blend)+data[k]*blend;
      pcm[i]=mix/channels;
    }
    return new Blob([pcmWav([pcm],rate)],{type:'audio/wav'});
  }
  function decodeSSE(raw) {
    for(const block of raw.replace(/\r\n/g,'\n').split('\n\n')){
      const lines=block.split('\n');const event=lines.find(l=>l.startsWith('event:'))?.slice(6).trim();
      const data=lines.filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trimStart()).join('\n');
      if(event==='error')throw Error('Qwen 服务识别失败：'+data.slice(0,250));
      if(event==='complete'){
        let result;
        try{result=JSON.parse(data);}catch{throw Error('Qwen 服务返回了无效 JSON');}
        const text=Array.isArray(result)?result[0]:Array.isArray(result?.data)?result.data[0]:null;
        if(typeof text!=='string')throw Error('Qwen 识别结果格式不符合预期');
        if(/^(Request failed|Processing error|No recognition result|No text content|Please upload)/i.test(text)) throw Error(text.slice(0,180));
        return text.trim();
      }
    }
    throw Error('Qwen 任务未返回 complete 结果，可能超时或连接中断');
  }
  async function qwenRequest(op,{body,token,signal,id}={}){
    const q=`?api=qwen_asr&op=${encodeURIComponent(op)}${id?'&id='+encodeURIComponent(id):''}`;
    const headers={'X-TCQ-ASR':'1'};if(token)headers['X-ASR-Token']=token;
    if(op==='upload')headers['Content-Type']='audio/wav';
    if(op==='call')headers['Content-Type']='application/json';
    const res=await fetch(q,{method:op==='result'?'GET':'POST',headers,body,signal,cache:'no-store'});
    const content=await res.text();
    if(!res.ok){let message='HTTP '+res.status;try{message=JSON.parse(content)?.error?.message || message;}catch{}throw Error(message);}
    if(op==='result')return decodeSSE(content);
    try{return JSON.parse(content);}catch{throw Error('ASR 服务没有返回有效 JSON');}
  }
  function newSubtitleRow(cue,index){
    const row=document.createElement('div');row.className='audio-subtitle-row';
    const jump=document.createElement('button');jump.className='btn';jump.type='button';jump.textContent=`${formatTime(cue.start)} – ${formatTime(cue.end)} · 第 ${index+1} 段`;
    jump.onclick=()=>{const p=$('audioLabPlayer');try{if(audioLab.originalBlob){p.currentTime=cue.start;p.play();}else notify('当前播放器未装载源音频。');}catch{}};
    const text=document.createElement('textarea');text.className='input-style';text.rows=2;text.value=cue.text;
    text.setAttribute('aria-label',`第 ${index+1} 条字幕`);
    text.addEventListener('input',()=>cue.text=text.value);
    row.append(jump,text);return row;
  }
  function renderCues(){
    const list=$('audioAsrCues');list.replaceChildren();
    audioLab.cues.forEach((cue,i)=>list.appendChild(newSubtitleRow(cue,i)));
    $('audioAsrResults').style.display=audioLab.cues.length?'block':'none';
  }
  function subtTime(t,format){const ms=Math.max(0,Math.round(t*1000));return `${String(Math.floor(ms/3600000)).padStart(2,'0')}:${String(Math.floor(ms/60000)%60).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}${format==='srt'?',':'.'}${String(ms%1000).padStart(3,'0')}`;}
  function subtitleExport(format){
    const cues=audioLab.cues.filter(c=>c.text.trim()&&c.end>c.start).sort((a,b)=>a.start-b.start);
    if(!cues.length)throw Error('没有可导出的识别文本');
    if(format==='txt')return cues.map(c=>c.text.trim()).join('\n');
    const prefix=format==='vtt'?'WEBVTT\n\n':'';
    return prefix+cues.map((c,i)=>`${i+1}\n${subtTime(c.start,format)} --> ${subtTime(c.end,format)}\n${c.text.trim()}\n`).join('\n');
  }
  $('audioAsrToText').onclick=()=>{
    try{
      const txt=subtitleExport('txt');universalText.value=universalText.value.trim()?universalText.value.trimEnd()+'\n'+txt:txt;
      universalText.dispatchEvent(new Event('input',{bubbles:true}));notify('✅ 转写文字已添加到上方主文本框。');
    }catch(e){notify('❌ '+e.message);}
  };
  for(const [id,ext] of [['audioAsrTxt','txt'],['audioAsrSrt','srt'],['audioAsrVtt','vtt']]){
    $(id).addEventListener('click',()=>{
      try{download(new Blob([subtitleExport(ext)],{type:'text/plain;charset=utf-8'}),`${safeStem(audioLab.name)}_asr.${ext}`);notify(`✅ 已保存 ${ext.toUpperCase()}，可在导出前修改每条字幕文字。`);}
      catch(e){notify('❌ '+e.message);}
    });
  }
  $('audioAsrCancel').addEventListener('click',()=>{if(audioLab.abort)audioLab.abort.abort();});
  $('btnAudioAsr').addEventListener('click',async()=>{
    openPanel();
    try{
      if(!(await fromCurrentFile(false))) {notify('请先在页面底部选择音频/视频，或点击“导入音视频”。');$('audioLabFile').click();return;}
      $('audioAsrRun').focus();
      notify('已就绪，确认识别范围和语言后点击「开始识别」。');
    }catch(e){notify('❌ '+e.message);}
  });
  $('audioAsrRun').addEventListener('click',async()=>{
    if(audioLab.abort) return;
    if(!audioLab.buffer){
      try{if(!(await fromCurrentFile())){notify('❌ 请先载入音视频');return;}}
      catch(e){notify('❌ '+e.message);return;}
    }
    const token=$('audioAsrToken').value.trim();
    if(token && !/^hf_[A-Za-z0-9_-]{4,256}$/.test(token)){notify('❌ Hugging Face Token 需要 hf_ 开头，不是其他平台的 sk- Key。');return;}
    const secs=Number($('audioAsrChunk').value);
    if(!Number.isInteger(secs)||secs<2||secs>30){notify('❌ 分段时长需为 2–30 秒');return;}
    let start,end;
    try {({start,end}=params($('audioAsrScope').value));}catch(e){notify('❌ '+e.message);return;}
    const context=$('audioAsrContext').value.slice(0,2000),language=$('audioAsrLanguage').value,itn=$('audioAsrITN').checked;
    const abort=new AbortController();audioLab.abort=abort;
    const signal=abort.signal,revision=audioLab.revision,all=audioLab.buffer,previous=audioLab.cues.slice(),next=[];
    $('audioAsrRun').disabled=true;$('audioAsrCancel').disabled=false;
    try{
      $('audioLabPlayer').pause();
      const count=Math.ceil((end-start)/secs);
      for(let i=0;i<count;i++){
        if(signal.aborted)throw new DOMException('已取消','AbortError');
        if(audioLab.revision!==revision)throw Error('源音频已发生变化，请重新运行识别');
        const left=start+i*secs,right=Math.min(end,left+secs);
        notify(`🎤 Qwen ASR：${i+1}/${count} 段 · ${left.toFixed(1)}–${right.toFixed(1)} 秒\n正在上传 16kHz 音频分段…`);
        const wav=chunkWav(all,left,right);
        const uploaded=await qwenRequest('upload',{body:wav,token,signal});
        const remote=uploaded?.[0];
        if(typeof remote!=='string'||!remote.startsWith('/'))throw Error('Space 音频上传返回格式无效');
        const data=[{path:remote,orig_name:'audio_chunk.wav',meta:{_type:'gradio.FileData'}},context,language,itn];
        notify(`🎤 Qwen ASR：${i+1}/${count} 段 · 排队 / 识别中…`);
        const job=await qwenRequest('call',{body:JSON.stringify({data}),token,signal});
        if(!/^[A-Za-z0-9_-]{1,128}$/.test(job?.event_id||''))throw Error('Space 没有返回任务编号');
        const content=await qwenRequest('result',{id:job.event_id,token,signal});
        if(content)next.push({start:left,end:right,text:content});
      }
      if(!next.length)throw Error('音频中未检测到有效语音');
      audioLab.cues=next;renderCues();
      notify(`✅ 识别结束：${next.length}/${count} 段。可逐段修改、导出 TXT/SRT/VTT。\n注意：时间范围为分段估算，需要人工校对。`);
    }catch(e){
      audioLab.cues=previous;renderCues();
      let message=String(e.message||e);if(token)message=message.split(token).join('[Token]');
      notify(signal.aborted?'识别已取消，原有字幕保留。':`❌ Qwen ASR 失败：${message.slice(0,400)}（已完成 ${next.length} 段，本次未覆盖旧结果）`);
    }finally{
      if(audioLab.abort===abort)audioLab.abort=null;
      $('audioAsrRun').disabled=false;$('audioAsrCancel').disabled=true;
    }
  });
  // 音视频来源变化时旧转写不再关联新素材，但不清空用户主文本框。
  universalFile.addEventListener('change',()=>{if(audioLab.buffer||audioLab.abort)resetEditor();});
  // 兼容主页面原“复制重置”按钮的现有处理流程。
  window.__resetAudioLab = resetEditor;
})();
