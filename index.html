<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPuck AI</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
<div class="nav">
<div class="logo">CPuck AI</div>
<div class="search-box"><input id="search" placeholder="搜索工具 / 模型 / 数据集 / 日志"></div>
</div>
</header>
<main class="main">
<section class="hero">
<h1>AI Knowledge</h1>
<p>工具、模型、数据集、硬件测试与实验日志</p>
</section>
<section class="card">
<h2>资源导航</h2>
<div id="list" class="grid"></div>
</section>
<section class="card" id="search-result" style="display:none">
<h2>搜索结果</h2>
<div id="result"></div>
</section>
</main>
<script>
let allData=[];
async function loadData(){
 try{
  let [list,posts]=await Promise.all([
   fetch('data/list.json').then(r=>r.json()),
   fetch('data/posts.json').then(r=>r.json()).catch(()=>[])
  ]);
  allData=[...list,...posts];
  document.getElementById('list').innerHTML=list.map(x=>renderItem(x)).join('');
 }catch(e){}
}
function renderItem(x){
 return `<a class="item" href="${x.url||x.link||'#'}" target="_blank"><b>${x.title||x.name||''}</b><br><span>${x.desc||''}</span></a>`;
}
function doSearch(q){
 let result=document.getElementById('search-result');
 if(!q){result.style.display='none';return;}
 result.style.display='block';
 let arr=allData.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
 document.getElementById('result').innerHTML=arr.map(x=>renderItem(x)).join('')||'无结果';
}
document.getElementById('search').addEventListener('input',e=>doSearch(e.target.value));
loadData();
</script>
</body>
</html>
