<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPuck AI</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
<div class="nav">
<div class="logo">CPuck AI</div>
<div class="search-box"><input id="search" placeholder="搜索工具 / 模型 / 数据集 / 日志"></div>
</div>
</header>
<main class="main">
<section class="hero">
<h1>AI Knowledge</h1>
<p>工具、模型、数据集、硬件测试与实验日志</p>
</section>
<section class="card">
<h2>资源导航</h2>
<div id="list" class="grid"></div>
</section>
<section class="card" id="search-result" style="display:none">
<h2>搜索结果</h2>
<div id="result" class="grid"></div>
</section>
</main>
<script>
let allData=[];

async function loadData(){
 let list=await fetch('data/list.json').then(r=>r.json()).catch(()=>[]);
 let posts=await fetch('data/posts.json').then(r=>r.json()).catch(()=>[]);
 allData=[...list,...posts];
 document.getElementById('list').innerHTML=list.map(renderItem).join('');
}

function renderItem(x){
 let links=x.links||{};
 let url=links.http||links.hf||x.url||x.link||'#';
 return `<a class="item" href="${url}" target="_blank">
<b>${x.title||x.name||''}</b><br>
<span>${x.desc||''}</span>
${links.hf?`<br><small>HF</small>`:''}
${links.hfCn?`<small> HF-CN</small>`:''}
</a>`;
}

document.getElementById('search').oninput=e=>{
 let q=e.target.value.trim().toLowerCase();
 let box=document.getElementById('search-result');
 if(!q){box.style.display='none';return;}
 box.style.display='block';
 document.getElementById('result').innerHTML=allData.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(renderItem).join('')||'无结果';
};

loadData();
</script>
</body>
</html>
