<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPuck AI</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
<div class="nav">
<div class="logo">CPuck AI</div>
<div class="search-box"><input id="search" placeholder="搜索工具 / 模型 / 数据集 / 日志"></div>
</div>
</header>
<main class="main">
<section class="hero">
<h1>AI Knowledge</h1>
<p>工具、模型、数据集、硬件测试与实验日志</p>
</section>
<section class="card">
<h2>资源导航</h2>
<div id="list" class="grid"></div>
</section>
<section class="card" id="search-result" style="display:none">
<h2>搜索结果</h2>
<div id="result"></div>
</section>
</main>
<script>
async function loadList(){
 try{
 let data=await fetch('data/list.json').then(r=>r.json());
 document.getElementById('list').innerHTML=data.map(x=>`<a class="item" href="${x.url||x.link}" target="_blank"><b>${x.title}</b><br><span>${x.desc||''}</span></a>`).join('');
 }catch(e){}
}
async function doSearch(q){
 if(!q)return;
 let result=document.getElementById('search-result');
 result.style.display='block';
 document.getElementById('result').innerHTML='搜索中...';
 try{
 let data=await fetch('data/search.json').then(r=>r.json());
 let arr=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
 document.getElementById('result').innerHTML=arr.map(x=>`<a class="item" href="${x.url||'#'}"><b>${x.title||x.name||''}</b><br>${x.desc||''}</a>`).join('')||'无结果';
 }catch(e){document.getElementById('result').innerHTML='无结果'}
}
document.getElementById('search').addEventListener('input',e=>doSearch(e.target.value));
loadList();
</script>
</body>
</html>
